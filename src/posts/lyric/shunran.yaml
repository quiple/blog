    time: [22.157, 25.05]
    tl: 무언가를 붙잡았다고 그걸로 환상을 부수고
  - text: 想いを冷ますとか愚の骨頂ね
    time: [25.1, 27.336]
    tl: 마음을 식히다니 어리석기 짝이 없네
  - text: ただの雑魚に取り合わないの
    time: [27.346, 29.052]
    tl: 그저 피라미와는 상대하지 않아
