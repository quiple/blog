  - text: 虚像に塗れた私 まるで神様みたいね
    time: [15.295, 18.188]
    tl: 허상투성이인 나, 마치 신 같네
  - text: 本当の気持ちとか知ったかぶりで
    time: [18.248, 20.453]
    tl: 진짜 마음 따위를 아는 척하며
