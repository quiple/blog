  - text: 虚像に塗れた私 まるで神様みたいね
    time: [15.295, 18.188]
  - text: 本当の気持ちとか知ったかぶりで
    time: [18.248, 20.453]
  - text: 気味が悪いの妖共め
    time: [20.463, 22.147]
  - text: 何かを掴んだとて それで幻想 壊して
    time: [22.157, 25.05]
  - text: 想いを冷ますとか愚の骨頂ね
    time: [25.1, 27.336]
  - text: ただの雑魚に取り合わないの
    time: [27.346, 29.052]
  - text: 冷静装う僕が 言葉を口にするのは
    time: [29.231, 32.449]
  - text: 簡単に虎視眈々と怒っているから
    time: [32.636, 35.084]
  - text: 春の嵐呼んだ 僕は泣いた 心傷つけられた
    time: [35.81, 39.289]
  - text: そんなの思い上がりでしょ？
    time: [39.299, 40.873]
  - text: どうせそうよね 分かっているけど
    time: [40.903, 42.712]
  - text: 吐いた息もきっと 煙たくて 目障りに映るでしょ
    time: [42.722, 46.158]
  - text: 愛されたいと願うのは
    time: [46.168, 47.835]
  - text: 罪というのね 甘い香りで
    time: [47.865, 49.57]
  - text: 揺れる炭酸(サイダー) 飲み干したら サヨナラしましょ
    time: [49.58, 52.432]
