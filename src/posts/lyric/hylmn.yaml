    time: [20.876, 24.204]
  - text: A skinny puppy movin' too fast
    pr: 어 스키니 퍼피 무빙 투 패스트
    tl: 너무 빨리 달리던 깡마른 강아지 한 마리
    time: [24.305, 27.309]
  - text: But now that skinny puppy's an even bigger dog
    pr: 벗 나우 댓 스키니 퍼피즈 언 이븐 비거 독
    tl: 하지만 이제 그 깡마른 강아지는 훨씬 큰 개가 됐어
