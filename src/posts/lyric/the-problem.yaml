lines:
  - text: もし人々すでに鳥のように飛べるなら
    pr: 모시히토비토스데니토리노요니토베루나라
    time: [1.919, 6.291]
  - text: 翼のさ、発明意味があるの?
    pr: 츠바사노사, 하츠메이이미가아루노?
    time: [6.291, 10.412]
  - text: もしすべての言葉作り上げているなら
    pr: 모시스베테노코토바츠쿠리아게테이루나라
    time: [10.412, 14.457]
  - text: 歌を作ったら、どんな意味があるのだろう?
    pr: 우타오츠쿳타라, 돈나이미가아루노다로?
    time: [14.457, 18.454]
  - text: もし青い空に太陽の光線 あるなら
    pr: 모시아오이소라니타이요노코센 아루나라
    time: [34.707, 39.1]
  - text: 光のさ、発明意味があるの?
    pr: 히카리노사, 하츠메이이미가아루노?
    time: [39.1, 43.215]
  - text: もしすべてのメロディー作り上げているなら
    pr: 모시스베테노메로디츠쿠리아게테이루나라
    time: [43.215, 47.278]
  - text: 曲を作ったら、意味があるの?
    pr: 쿄쿠오츠쿳타라, 이미가아루노?
    time: [47.278, 51.424]
  - text: 分かんない、ほんと分かんない!
    pr: 와칸나이, 혼토와칸나이!
    time: [51.424, 54.76]
    duet: true
  - text: 君がそんな些細なこと気にするならどけよ!
    pr: 키미가손나사사이나코토키니스루나라도케요!
    time: [54.76, 59.644]
    duet: true
  - text: たまんない、マジたまんない!
    pr: 타만나이, 마지타만나이!
    time: [59.644, 62.485]
    duet: true
  - text: 急に哲学に興味あるのか?
    pr: 큐니테츠가쿠니쿄미아루노카?
    time: [62.485, 65.898]
    duet: true
  - text: 勉強邪魔しないでよ!
    pr: 벤쿄자마시나이데요!
    time: [65.898, 69.538]
    duet: true
  - text: 時間は容赦なくながれてく
    pr: 지칸와요샤나쿠나가레테쿠
    time: [75.908, 78.125]
  - text: 日々年を重ねてくる
    pr: 히비토시오카사네테쿠루
    time: [78.125, 80.125]
  - text: まだ僕は見つからないんだ
    pr: 마다보쿠와미츠카라나인다
    time: [80.125, 84.198]
  - text: 適切な仕事を
    pr: 테키세츠나시고토오
    time: [80.125, 84.198]
  - text: 経験があれば勝ちだ
    pr: 케이켄가아레바카치다
    time: [84.198, 86.333]
  - text: コネがあれば勝ちだ
    pr: 코네가아레바카치다
    time: [86.333, 88.33]
  - text: 何もなくてもキレイなら勝ちだ
    pr: 나니모나쿠테모키레이나라카치다
    time: [88.413, 92.224]
  - text: ただ好きなことをやりたいんだ
    pr: 타다스키나코토오야리타인다
    time: [92.224, 94.938]
  - text: なんでそんな不正な運命?
    pr: 난데손나후세이나운메이?
    time: [94.938, 96.575]
  - text: どうしてどうしてのかな
    pr: 도시테도시테노카나
    time: [96.575, 100.463]
  - text: 分かんない、ほんと分かんない!
    pr: 와칸나이, 혼토와칸나이!
    time: [100.695, 103.881]
    duet: true
  - text: 君がそんな深刻なこと気にするなら勉強してよ!
    pr: 키미가손나신코쿠나코토키니스루나라벤쿄시테요!
    time: [104, 108.853]
    duet: true
  - text: たまんない、マジたまんない!
    pr: 타만나이, 마지타만나이!
    time: [108.853, 112.143]
    duet: true
  - text: 急に仕事に興味あるのか?
    pr: 큐니시고토니쿄미아루노카?
    time: [112.143, 114.979]
  - text: 睡眠邪魔しないでよ!
    pr: 스이민자마시나이데요!
    time: [114.979, 118.264]
  - text: また邪魔をしたら 君 部屋から追い出すぞ!
    pr: 마타자마오시타라 키미 헤야카라오이다스조!
    time: [120.855, 125.939]
  - text: もういいよ、もういいよ
    pr: 모이이요, 모이이요
    time: [129.512, 130.921]
  - text: どうせ眠れないから教えてくれよ
    pr: 도세네무레나이카라오시에테쿠레요
    time: [130.921, 134.287]
