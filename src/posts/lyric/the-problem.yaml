lines:
  - text: もし人々すでに鳥のように飛べるなら
    pr: 모시히토비토스데니토리노요니토베루나라
    time: [1.785, 6.062]
  - text: 翼のさ、発明意味があるの?
    pr: 츠바사노사, 하츠메이이미가아루노?
    time: [6.16, 9.901]
  - text: もしすべての言葉作り上げているなら
    pr: 모시스베테노코토바츠쿠리아게테이루나라
    time: [10.486, 14.295]
  - text: 歌を作ったら、どんな意味があるのだろう?
    pr: 우타오츠쿳타라, 돈나이미가아루노다로?
    time: [14.407, 18.879]
  - text: もし青い空に太陽の光線 あるなら
    pr: 모시아오이소라니타이요노코센 아루나라
    time: [34.671, 38.892]
  - text: 光のさ、発明意味があるの?
    pr: 히카리노사, 하츠메이이미가아루노?
    time: [38.997, 42.609]
  - text: もしすべてのメロディー作り上げているなら
    pr: 모시스베테노메로디츠쿠리아게테이루나라
    time: [43.322, 47.094]
  - text: 曲を作ったら、意味があるの?
    pr: 쿄쿠오츠쿳타라, 이미가아루노?
    time: [47.173, 51.207]
  - text: 分かんない、ほんと分かんない!
    pr: 와칸나이, 혼토와칸나이!
    time: [51.293, 54.541]
    duet: true
  - text: 君がそんな些細なこと気にするならどけよ!
    pr: 키미가손나사사이나코토키니스루나라도케요!
    time: [54.638, 59.487]
    duet: true
  - text: たまんない、マジたまんない!
    pr: 타만나이, 마지타만나이!
    time: [59.513, 62.767]
    duet: true
  - text: 急に哲学に興味あるのか?
    pr: 큐니테츠가쿠니쿄미아루노카?
    time: [62.838, 65.917]
    duet: true
  - text: 勉強邪魔しないでよ!
    pr: 벤쿄자마시나이데요!
    time: [65.917, 69.388]
    duet: true
  - text: 時間は容赦なくながれてく
    pr: 지칸와요샤나쿠나가레테쿠
    time: [75.555, 77.665]
  - text: 日々年を重ねてくる
    pr: 히비토시오카사네테쿠루
    time: [77.965, 79.979]
  - text: まだ僕は見つからないんだ
    pr: 마다보쿠와미츠카라나인다
    time: [80.104, 82.094]
  - text: 適切な仕事を
    pr: 테키세츠나시고토오
    time: [82.324, 83.903]
  - text: 経験があれば勝ちだ
    pr: 케이켄가아레바카치다
    time: [84.11, 85.82]
  - text: コネがあれば勝ちだ
    pr: 코네가아레바카치다
    time: [86.154, 87.876]
  - text: 何もなくてもキレイなら勝ちだ
    pr: 나니모나쿠테모키레이나라카치다
    time: [88.232, 91.833]
  - text: ただ好きなことをやりたいんだ
    pr: 타다스키나코토오야리타인다
    time: [92.069, 94.144]
  - text: なんでそんな不正な運命?
    pr: 난데손나후세이나운메이?
    time: [94.389, 96.335]
  - text: どうしてどうしてのかな
    pr: 도시테도시테노카나
    time: [96.441, 100.024]
  - text: 分かんない、ほんと分かんない!
    pr: 와칸나이, 혼토와칸나이!
    time: [100.518, 103.79]
    duet: true
  - text: 君がそんな深刻なこと気にするなら勉強してよ!
    pr: 키미가손나신코쿠나코토키니스루나라벤쿄시테요!
    time: [103.866, 108.734]
    duet: true
  - text: たまんない、マジたまんない!
    pr: 타만나이, 마지타만나이!
    time: [108.734, 111.995]
    duet: true
  - text: 急に仕事に興味あるのか?
    pr: 큐니시고토니쿄미아루노카?
    time: [112.067, 114.924]
    duet: true
  - text: 睡眠邪魔しないでよ!
    pr: 스이민자마시나이데요!
    time: [115.055, 118.491]
    duet: true
  - text: また邪魔をしたら 君 部屋から追い出すぞ!
    pr: 마타자마오시타라 키미 헤야카라오이다스조!
    time: [120.8, 125.412]
    duet: true
  - text: もういいよ、もういいよ
    pr: 모이이요, 모이이요
    time: [129.255, 130.792]
    duet: true
  - text: どうせ眠れないから教えてくれよ
    pr: 도세네무레나이카라오시에테쿠레요
    time: [130.792, 134.034]
    duet: true
