  - text: 足を鳴らして俺も笑うよ
    pr: 아시오나라시테오레모와라우요
  - text: どうもこうも無い
    pr: 도모코모네
  - text: 只、それだけだ
    pr: 타다, 소레다케다
  - text: 一握の生命のカケラだ
    pr: 이치아쿠노이노치노카케라다
  - text: 行けば帰らざる雲が行きゃ
    pr: 유케바카에라자루쿠모가유캬
