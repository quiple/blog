title: 踵鳴る
titleTl: 발뒤꿈치가 울리네
titleLang: ja
year: '2001'
artist: eastern-youth
lang: ja
sp: 7aETU8v4vh76wmxZHu8z8q
yt:
  audio: vF-nmZHevcg
lines:
  - text: 窓を叩く空は
    pr: 마도오타타쿠소라와
    tl: 창을 두드리는 하늘은
  - text: 割れる様に笑うよ
    pr: 와레루요니와라우요
    tl: 깨질 듯이 웃네
  - text: 汚れ眼鏡が青く染まれば
    pr: 요고레메가네가아오쿠소마레바
    tl: 더러운 안경이 파랗게 물들면
  - text: 足を鳴らして俺も笑うよ
    pr: 아시오나라시테오레모와라우요
    tl: 발을 구르며 나도 웃을 거야
  - text: どうもこうも無い
    pr: 도모코모네
    tl: 이렇다 저렇다 할 것도 없어
  - text: 只、それだけだ
    pr: 타다, 소레다케다
    tl: 그저 그뿐이야
  - text: 一握の生命のカケラだ
    pr: 이치아쿠노이노치노카케라다
    tl: 한 줌 생명의 조각이야
  - text: 行けば帰らざる雲が行きゃ
    pr: 유케바카에라자루쿠모가유캬
    tl: 한번 가면 돌아오지 않는 구름이 가면
  - text: 俺は口笛を吹きまくるさ
    pr: 오레와쿠치부에오후키마쿠루사
    tl: 난 실컷 휘파람을 불겠어
  - words:
      - text: 解答
        ruby: こたえ
      - text: は知らない
    pr: 코타에와시라네
    tl: 정답은 몰라
  - words:
      - text: 教典
        ruby: おしえ
      - text: はいらない
    pr: 오시에와이라네
    tl: 경전은 필요 없어
  - text: 歩く踵がそれを識るだろう
    pr: 아루쿠카카토가소레오시루다로
    tl: 걸어가는 발뒤꿈치가 알겠지
  - text: 朝の地鳴りが告げるだろう
    pr: 아사노지나리가츠게루다로
    tl: 아침의 땅울림이 알려 주겠지
  - text: 怠く横たわる川面の憂鬱を
    pr: 다루쿠요코타와루카와모노유우츠오
    tl: 나른하게 누워 있는 수면의 우울을
  - text: 赤く煮え立つ空が染めれば
    pr: 아카쿠니에타츠소라가소메레바
    tl: 붉게 끓어오르는 하늘이 물들이면
  - text: 俺は涙をそこに捨てるよ
    pr: 오레와나미다오소코니스테루요
    tl: 난 눈물을 거기에 버릴게
  - text: 日も暮れた帰ろうかな
    pr: 히모쿠레타카에로카나
    tl: 해도 졌으니 돌아갈까
  - text: 午後六時 全てが遠いが
    pr: 고고로쿠지 스베테가토이가
    tl: 오후 여섯 시, 모든 게 멀지만
  - text: それを誰一人尋ねども
    pr: 소레오다레히토리타즈네도모
    tl: 누군가 그걸 묻더라도
  - text: 血巡り季巡り撃ち放つさ
    pr: 치메구리키메구리우치하나츠사
    tl: 피가 돌고 계절이 돌아 쏘아 낼 거야
  - words:
      - text: 道程
        ruby: みち
      - text: など知らない
    pr: 미치나도시라네
    tl: 여정 따위는 몰라
  - words:
      - text: 標識
        ruby: しるべ
      - text: はいらない
    pr: 시루베와이라네
    tl: 표지판은 필요 없어
  - text: 微笑を湛えて闇と遊べば
    pr: 에미오타타에테야미토아소베바
    tl: 미소를 머금고 어둠과 놀면
  - text: 誰ぞ知り得ぬ灯も点る
    pr: 다레조시리에누히모토모루
    tl: 아무도 모르는 불도 켜져
