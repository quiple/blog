lines:
  - text: 目頭はシュッと目尻は丸く
    tl: 눈 앞머리는 날렵하게, 눈꼬리는 둥글게
  - text: 二重はくっきり平行のカーブ
    tl: 쌍꺼풀은 또렷한 평행 곡선으로
  - text: 鼻先もシュッと目立たないくらい
    tl: 코끝도 눈에 띄지 않을 만큼 날렵하게
  - text: 唇は針でハリを頂戴
    tl: 입술에는 바늘로 탄력을 줘
  - text: 痛いの痛いのとんでゆけ
    tl: 아픈 것아, 아픈 것아, 날아가라
  - text: あ、額も似合うのつけ足して
    tl: 아, 이마도 어울리게 더해 줘
  - text: ズルじゃないの リタイア出来ないの
    tl: 반칙이 아니야, 그만둘 수 없어
  - text: 鏡よ鏡 この世でいちばん美しい人はだあれ?
    tl: 거울아 거울아, 이 세상에서 가장 아름다운 사람은 누구니?
  - text: 流行り廃れないように
    tl: 유행에 뒤처지지 않도록
  - text: バレないように完璧になりたい
    tl: 들키지 않게 완벽해지고 싶어
  - text: Oh ノーノーノーノーノー 見ないで
    tl: 오, 노 노 노 노 노, 보지 마
  - text: 理想のドア開いてもうゴールしたいです
    tl: 이상의 문을 열고 이제 골인하고 싶어요
  - text: You know what I mean?
    tl: 무슨 말인지 알겠니?
  - text: ビューティフルが足りない
    tl: 아름다움이 부족해
  - text: プラシーボでもください
    tl: 플라세보라도 주세요
  - text: そしたらきっと泣いたりしないもん
    tl: 그러면 분명 울지 않을 거야
  - text: 肌も髪もそうツヤがなくちゃ
    tl: 피부도 머리카락도, 그래, 윤기가 있어야지
