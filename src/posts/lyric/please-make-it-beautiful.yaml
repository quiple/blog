  - text: 味わったら直ぐ吐き捨てなくちゃ
    tl: 맛보면 바로 뱉어 버려야지
  - text: 腫らして溶かしてぼかして美化して
    tl: 부풀리고 녹이고 흐리고 미화하고
  - text: 痛いの痛いのとんでゆけ
