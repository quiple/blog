lines:
  - text: 目頭はシュッと目尻は丸く
    pr: 메가시라와슛토메지리와마루쿠
    tl: 눈 앞머리는 날렵하게, 눈꼬리는 둥글게
  - text: 二重はくっきり平行のカーブ
    pr: 후타에와쿳키리헤이코노카부
    tl: 쌍꺼풀은 또렷한 평행 곡선으로
  - text: 鼻先もシュッと目立たないくらい
    pr: 하나사키모슛토메다타나이쿠라이
    tl: 코끝도 눈에 띄지 않을 만큼 날렵하게
  - text: 唇は針でハリを頂戴
    pr: 쿠치비루와하리데하리오초다이
    tl: 입술에는 바늘로 탄력을 줘
  - text: 痛いの痛いのとんでゆけ
    pr: 이타이노이타이노톤데유케
    tl: 아픈 것아, 아픈 것아, 날아가라
  - text: あ、額も似合うのつけ足して
    pr: 아, 가쿠모니아우노츠케타시테
    tl: 아, 이마도 어울리게 더해 줘
  - text: ズルじゃないの リタイア出来ないの
    pr: 즈루자나이노 리타이아데키나이노
    tl: 반칙이 아니야, 그만둘 수 없어
  - text: 鏡よ鏡 この世でいちばん美しい人はだあれ?
    pr: 카가미요카가미 코노요데이치반우츠쿠시이히토와다레?
    tl: 거울아 거울아, 이 세상에서 가장 아름다운 사람은 누구니?
  - text: 流行り廃れないように
    pr: 하야리스타레나이요니
    tl: 유행에 뒤처지지 않도록
  - text: バレないように完璧になりたい
    pr: 바레나이요니칸페키니나리타이
    tl: 들키지 않게 완벽해지고 싶어
  - text: Oh ノーノーノーノーノー 見ないで
    pr: Oh 노노노노노 미나이데
    tl: 오, 노 노 노 노 노, 보지 마
  - text: 理想のドア開いてもうゴールしたいです
    pr: 리소노도아히라이테모고루시타이데스
    tl: 이상의 문을 열고 이제 골인하고 싶어요
  - text: You know what I mean?
    tl: 무슨 말인지 알겠니?
  - text: ビューティフルが足りない
    pr: 뷰티후루가타리나이
    tl: 아름다움이 부족해
  - text: プラシーボでもください
    pr: 푸라시보데모쿠다사이
    tl: 플라세보라도 주세요
  - text: そしたらきっと泣いたりしないもん
    pr: 소시타라킷토나이타리시나이몬
    tl: 그러면 분명 울지 않을 거야
  - text: 肌も髪もそうツヤがなくちゃ
    pr: 하다모카미모소츠야가나쿠차
    tl: 피부도 머리카락도, 그래, 윤기가 있어야지
  - text: むやみなやさしさ麻酔をしなくちゃ
    pr: 무야미나야사시사마스이오시나쿠차
    tl: 무분별한 다정함에는 마취를 해야지
  - text: 味わったら直ぐ吐き捨てなくちゃ
    pr: 아지왓타라스구하키스테나쿠차
    tl: 맛보면 바로 뱉어 버려야지
  - text: 腫らして溶かしてぼかして美化して
    pr: 하라시테토카시테보카시테비카시테
    tl: 부풀리고 녹이고 흐리고 미화하고
  - text: 痛いの痛いのとんでゆけ
    pr: 이타이노이타이노톤데유케
    tl: 아픈 것아, 아픈 것아, 날아가라
  - text: あ、未来は心配 要らないぜ
    pr: 아, 미라이와신파이 이라나이제
    tl: 아, 미래는 걱정할 필요 없어
  - text: 今じゃないとまるで意味がないの
    pr: 이마자나이토마루데이미가나이노
    tl: 지금이 아니면 아무 의미가 없어
  - text: 鏡よ鏡 この世でいちばん美しい人はだあれ?
    pr: 카가미요카가미 코노요데이치반우츠쿠시이히토와다레?
