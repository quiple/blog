lines:
  - text: Hey, what is this? Is this long-awaited bliss?
    tl: 어, 뭐야? 이게 그토록 기다리던 행복인가?
    time: [10.461, 12.642]
  - text: I've been sending out these emails just for them to get dismissed
    tl: 그동안 이메일을 보내도 번번이 퇴짜만 맞았는데
    time: [12.766, 15.247]
  - text: Finally, a company has noticed me, so I won't live in poverty
    tl: 드디어 날 눈여겨본 회사가 생겼으니 가난하게 살진 않겠지
    time: [15.717, 20.662]
  - text: So I get up to cheer and even scream
    tl: 자리에서 일어나 환호하고 소리까지 질러
    time: [20.715, 24.742]
  - text: I might then achieve my corporate dream
    tl: 회사에 들어가겠다는 꿈을 이룰지도 몰라
    time: [26.2, 29.761]
  - text: Hire me!
    tl: 날 채용해 줘!
    time: [31.441, 32.48]
  - text: I swear that you found just the perfect guy
    tl: 맹세해, 완벽한 인재를 찾은 거야
    time: [32.48, 34.415]
  - text: ’Cause I'm sitting here in suit and tie
    tl: 정장에 넥타이까지 매고 앉아 있잖아
    time: [34.415, 36.36]
  - text: And yes, I know I may not have much experience
    tl: 그래, 나도 경력이 별로 없다는 건 알아
    time: [36.36, 39.31]
  - text: And I know that one-year gap might sound mysterious
    tl: 1년의 공백이 수상하게 들릴 수도 있지
    time: [39.31, 43.078]
  - text: You just need to give me a single chance
    tl: 딱 한 번만 기회를 줘
    time: [43.078, 44.926]
  - text: I'm a great colleague; I'm telling you it in advance
    tl: 난 좋은 동료가 될 거야, 미리 말해 두지만
    time: [44.926, 47.543]
  - text: I may not have a degree, but please, just hire me
    tl: 학위는 없을지 몰라도 제발 날 채용해 줘
    time: [48.171, 51.947]
  - text: Oh, well, I guess that just wasn't meant to be
    tl: 아, 뭐, 역시 인연이 아니었나 봐
    time: [51.947, 54.775]
