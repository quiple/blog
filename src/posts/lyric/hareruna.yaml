title: 晴れるな
titleTl: 개지 마
titleLang: ja
year: '2023'
artist: sundae-may-club
lang: ja
sp: 2YTSYQPXLljftwle3Q6Jom
yt:
  audio: Hut8stIaE6M
  mv: g7h2d5wszQs
lines:
  - text: ちょっと目を離した隙に全てがなくなっちゃいそうだ
    pr: 촛토메오하나시타스키니스베테가나쿠낫차이소다
    tl: 잠깐 눈을 뗀 사이 전부 없어질 것 같아
    time: [0.867, 7.263]
  - text: 梅雨入り 眠れないカーテンの中
    pr: 츠유이리 네무레나이카텐노나카
    tl: 장마가 시작돼, 잠 못 드는 커튼 안
    time: [7.398, 12.276]
  - text: 汚れた靴を洗う元気もないし
    pr: 요고레타쿠츠오아라우겐키모나이시
    tl: 더러운 신발을 씻을 기운도 없고
    time: [12.408, 16.301]
  - text: 甲斐性なしの体は無駄に重たい
    pr: 카이쇼나시노카라다와무다니오모타이
    tl: 능력 없는 몸은 쓸데없이 무거워
    time: [16.385, 21.866]
  - text: 元気出せとかうるせえな
    pr: 겐키다세토카우루세나
    tl: 힘내라니 시끄러워
    time: [22.617, 24.917]
  - text: ほら辛い人はたくさんだ
    pr: 호라츠라이히토와타쿠산다
    tl: 봐, 힘든 사람은 한가득이야
    time: [24.95, 27.583]
  - text: そりゃみんな俯いちゃうよな
    pr: 소랴민나우츠무이차우요나
    tl: 그야 다들 고개를 숙이겠지
    time: [27.751, 30.218]
  - text: 助けてほしいだけ
    pr: 타스케테호시다케
    tl: 그저 도움받고 싶을 뿐
    time: [30.299, 32.983]
  - text: 全部どうでもいい 何が終わろうがどうでもいい
    pr: 젠부도데모이이 나니가오와로가도데모이이
    tl: 전부 아무래도 좋아, 뭐가 끝나든 아무래도 좋아
    time: [33.135, 38.118]
  - text: 話しても無駄だしな 何言っても伝わらないんだもん
    pr: 하나시테모무다다시나 나니잇테모츠타와라나인다몬
    tl: 말해도 소용없어, 무슨 말을 해도 전해지지 않으니까
    time: [38.118, 43.757]
  - text: 頑張って報われるのか 朝日を浴びれば明るくなれるのか
    pr: 간밧테무쿠와레루노카 아사히오아비레바아카루쿠나레루노카
    tl: 노력하면 보답받을까, 아침 햇살을 쬐면 밝아질 수 있을까
    time: [43.822, 49.455]
  - text: あてにならない今日をとりあえずこなしていく
    pr: 아테니나라나이쿄오토리아에즈코나시테이쿠
    tl: 믿을 수 없는 오늘을 일단 해내 가
    time: [49.555, 62.154]
  - text: やっぱり地面を這うような気持ちは晴れないままで
    pr: 얏파리지멘오하우요나키모치와하레나이마마데
    tl: 역시 땅을 기는 듯한 기분은 개지 않은 채
    time: [65.205, 70.576]
  - text: 結局眠れないからひたすら思い出を並べてる
    pr: 켓쿄쿠네무레나이카라히타스라오모이데오나라베테루
    tl: 결국 잠이 안 와서 그저 추억을 늘어놓고 있어
    time: [70.66, 75.512]
  - text: ありきたりな曲しか書けない
    pr: 아리키타리나쿄쿠시카카케나이
    tl: 뻔한 곡밖에 쓸 수 없어
    time: [75.73, 78.028]
  - text: 若さは痛さでしかない 未熟な感性を引きずって歩く
    pr: 와카사와이타사데시카나이 미주쿠나칸세이오히키즛테아루쿠
    tl: 젊음은 아픔일 뿐, 미숙한 감성을 끌고 걸어
    time: [78.312, 85.181]
  - text: あんたのことは分からんよ
    pr: 안타노코토와와카란요
    tl: 네 일은 잘 몰라
    time: [85.998, 88.232]
  - text: でも一緒にやっていきたいんだ
    pr: 데모잇쇼니얏테이키타인다
    tl: 하지만 함께 해 나가고 싶어
    time: [88.298, 90.78]
  - text: それが無理ならばさよならだ
    pr: 소레가무리나라바사요나라다
    tl: 그게 안 된다면 작별이야
    time: [90.848, 93.364]
  - text: うまくいかないもんだな
    pr: 우마쿠이카나이몬다나
    tl: 잘 안 되는구나
    time: [93.532, 99.314]
  - text: もうやめたいとやっぱりの狭間でおろおろしてるんだ
    pr: 모야메타이토얏파리노하자마데오로오로시테룬다
    tl: 이제 그만하고 싶다와 역시 안 된다는 마음 사이에서 허둥대
    time: [117.693, 122.517]
  - text: 何が正しいか分からない ただ幸せになりたかった
    pr: 나니가타다시카와카라나이 타다시아와세니나리타캇타
    tl: 뭐가 옳은지 모르겠어, 그저 행복해지고 싶었어
    time: [122.585, 128.389]
  - text: 何も捨てたくない 全部抱えて生きていきたい
    pr: 나니모스테타쿠나이 젠부카카에테이키테이키타이
    tl: 아무것도 버리고 싶지 않아, 전부 안고 살아가고 싶어
    time: [129.721, 135.543]
  - text: 陽が入らない部屋の隅っこで丸まっている
    pr: 히가하이라나이헤야노스밋코데마루맛테이루
    tl: 햇빛 안 드는 방구석에 웅크려 있어
    time: [135.543, 140.978]
  - text: 絡まった頭の中 捨ててしまえれば楽かもな
    pr: 카라맛타아타마노나카 스테테시마에레바라쿠카모나
    tl: 뒤엉킨 머릿속을 버릴 수 있다면 편할지도 몰라
    time: [141.076, 146.015]
  - text: ただ 今は 昔のこと思い出してる
    pr: 타다 이마와 무카시노코토오모이다시테루
    tl: 그저 지금은 옛일을 떠올리고 있어
    time: [146.08, 156.882]
