lines:
  - text: ちょっと目を離した隙に全てがなくなっちゃいそうだ
    time: [0.867, 7.263]
  - text: 梅雨入り 眠れないカーテンの中
    time: [7.398, 12.276]
  - text: 汚れた靴を洗う元気もないし
    time: [12.408, 16.301]
  - text: 甲斐性なしの体は無駄に重たい
    time: [16.385, 21.866]
  - text: 元気出せとかうるせえな
    time: [22.617, 24.917]
  - text: ほら辛い人はたくさんだ
    time: [24.95, 27.583]
  - text: そりゃみんな俯いちゃうよな
    time: [27.751, 30.218]
  - text: 助けてほしいだけ
    time: [30.299, 32.983]
  - text: 全部どうでもいい 何が終わろうがどうでもいい
    time: [33.135, 38.118]
  - text: 話しても無駄だしな 何言っても伝わらないんだもん
    time: [38.118, 43.757]
  - text: 頑張って報われるのか 朝日を浴びれば明るくなれるのか
    time: [43.822, 49.455]
  - text: あてにならない今日をとりあえずこなしていく
    time: [49.555, 62.154]
  - text: やっぱり地面を這うような気持ちは晴れないままで
    time: [65.205, 70.576]
  - text: 結局眠れないからひたすら思い出を並べてる
    time: [70.66, 75.512]
  - text: ありきたりな曲しか書けない
    time: [75.73, 78.028]
  - text: 若さは痛さでしかない 未熟な感性を引きずって歩く
    time: [78.312, 85.181]
  - text: あんたのことは分からんよ
    time: [85.998, 88.232]
  - text: でも一緒にやっていきたいんだ
    time: [88.298, 90.78]
  - text: それが無理ならばさよならだ
    time: [90.848, 93.364]
  - text: うまくいかないもんだな
    time: [93.532, 99.314]
  - text: もうやめたいとやっぱりの狭間でおろおろしてるんだ
    time: [117.693, 122.517]
  - text: 何が正しいか分からない ただ幸せになりたかった
    time: [122.585, 128.389]
  - text: 何も捨てたくない 全部抱えて生きていきたい
    time: [129.721, 135.543]
  - text: 陽が入らない部屋の隅っこで丸まっている
    time: [135.543, 140.978]
  - text: 絡まった頭の中 捨ててしまえれば楽かもな
    time: [141.076, 146.015]
  - text: ただ 今は 昔のこと思い出してる
    time: [146.08, 156.882]
