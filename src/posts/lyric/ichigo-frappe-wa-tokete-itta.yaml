title: 苺フラッペは溶けていた
titleTl: 딸기 프라페는 녹아 있었다
titleLang: ja
year: '2015'
artist: omori-seiko
lang: ja
sp: 6sMAiumMMfRnB8xmjCaJfa
yt:
  audio: 0EwtEuk0AqQ
lines:
  - text: 立派に育った不幸が突然 私の右頬をぶってきた
    pr: 릿파니소닷타후코가토츠젠 아타시노미기호오붓테키타
    tl: 무럭무럭 자란 불행이 갑자기 내 오른뺨을 때렸어
    time: [0, 7.797]
  - text: ちょうど頬張っていた幸せの胡桃が歯を砕いて血を吐いた
    pr: 초도호밧테이타시아와세노쿠루미가하오쿠다이테치오하이타
    tl: 마침 입에 넣고 있던 행복의 호두가 이를 부숴 피를 토했어
    time: [7.797, 15.25]
  - text: 最後に負けたら台なしね 戦ったことすらむなしいの
    pr: 사이고니마케타라다이나시네 타타캇타코토스라무나시이노
    tl: 마지막에 지면 다 헛일이지, 싸웠다는 사실마저 허무해
    time: [15.25, 22.282]
  - text: 赤い血にふやけた胡桃を噛んでも 鉄の味すらしなかった
    pr: 아카이치니후야케타쿠루미오칸데모 테츠노아지스라시나캇타
    tl: 붉은 피에 불은 호두를 씹어도 쇠 맛조차 나지 않았어
    time: [22.282, 31.117]
  - text: スーパー帰りのおばはんが キーッとてド派手なブレーキで
    pr: 스파가에리노오바한가 킷토테도하데나부레키데
    tl: 마트에서 돌아오던 아줌마가 끼익 요란하게 브레이크를 밟으며
    time: [31.822, 41.021]
  - text: 夕暮れ張りつめた絶望の気持ちの行列に割り込んだ
    pr: 유구레하리츠메타제츠보노키모치노교레츠니와리콘다
    tl: 해질녘 팽팽한 절망의 마음이 늘어선 줄에 끼어들었어
    time: [41.021, 47.368]
  - text: 殺した理由を打ちあけた 火サスの犯人飛びおりた
    pr: 코로시타리유오우치아케타 카사스노한닌토비오리타
    tl: 죽인 이유를 털어놓고 화요 서스펜스의 범인이 뛰어내렸어
    time: [47.368, 53.61]
  - text: 自己犠牲が美しいうちに泣いて笑ってすればいいわ
    pr: 지코기세이가우츠쿠시우치니나이테와랏테스레바이이와
    tl: 자기희생이 아름다울 때 울고 웃으면 돼
    time: [53.61, 60.076]
  - text: そのうちに私みたいにね 怖いものなんてなくなるの
    pr: 소노우치니아타시미타이니네 코와이모노난테나쿠나루노
    tl: 그러다 보면 나처럼 무서운 것 따윈 없어질 거야
    time: [60.076, 66.65]
  - text: 一度きりの人生だから おいしい思いをしましょうね
    pr: 이치도키리노진세이다카라 오이시오모이오시마쇼네
    tl: 한 번뿐인 인생이니까 맛있는 재미를 보자
    time: [66.65, 72.963]
  - text: 前かごのエコバッグの苺フラッペは溶けていた
    pr: 마에카고노에코밧구노이치고후랏페와토케테이타
    tl: 앞바구니 장바구니 속 딸기 프라페는 녹아 있었어
    time: [73.53, 79.627]
  - text: おばさんのデザートの苺フラッペは溶けていた
    pr: 오바산노데자토노이치고후랏페와토케테이타
    tl: 아줌마의 디저트인 딸기 프라페는 녹아 있었어
    time: [79.627, 85.708]
  - text: 不幸自慢のアル中とシラフでケンカした帰り道
    pr: 후코지만노아루추토시라후데켄카시타카에리미치
    tl: 불행을 자랑하는 알코올 중독자와 맨정신으로 싸우고 돌아오는 길
    time: [111.707, 117.813]
  - text: 人生ツマミにしけてんな 酒をツマミに明日もがんばろうぜ
    pr: 진세이츠마미니시케텐나 사케오츠마미니아시타모간바로제
    tl: 인생을 안주로 삼기엔 시시하네, 술을 안주 삼아 내일도 힘내자
    time: [117.813, 124.523]
  - text: 最後に負けたら台なしね 最後までやれなきゃ能無しだ
    pr: 사이고니마케타라다이나시네 사이고마데야레나캬노나시다
    tl: 마지막에 지면 다 헛일이지, 끝까지 못 하면 무능한 거야
    time: [124.523, 130.673]
  - text: 一度きりの人生何度だって 美味しい思いをしましょうね
    pr: 이치도키리노진세이난도닷테 오이시오모이오시마쇼네
    tl: 한 번뿐인 인생, 몇 번이고 맛있는 재미를 보자
    time: [130.673, 136.857]
  - text: 前かごのエコバッグの苺フラッペは溶けていた
    pr: 마에카고노에코밧구노이치고후랏페와토케테이타
    tl: 앞바구니 장바구니 속 딸기 프라페는 녹아 있었어
    time: [137.416, 143.721]
  - text: おばさんのデザートの苺フラッペは溶けていた
    pr: 오바산노데자토노이치고후랏페와토케테이타
    tl: 아줌마의 디저트인 딸기 프라페는 녹아 있었어
    time: [143.721, 149.867]
