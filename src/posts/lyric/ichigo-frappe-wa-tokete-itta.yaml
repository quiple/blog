lines:
  - text: 立派に育った不幸が突然 私の右頬をぶってきた
    time: [0, 7.797]
  - text: ちょうど頬張っていた幸せの胡桃が歯を砕いて血を吐いた
    time: [7.797, 15.25]
  - text: 最後に負けたら台なしね 戦ったことすらむなしいの
    time: [15.25, 22.282]
  - text: 赤い血にふやけた胡桃を噛んでも 鉄の味すらしなかった
    time: [22.282, 31.117]
  - text: スーパー帰りのおばはんが キーッとてド派手なブレーキで
    time: [31.822, 41.021]
  - text: 夕暮れ張りつめた絶望の気持ちの行列に割り込んだ
    time: [41.021, 47.368]
  - text: 殺した理由を打ちあけた 火サスの犯人飛びおりた
    time: [47.368, 53.61]
  - text: 自己犠牲が美しいうちに泣いて笑ってすればいいわ
    time: [53.61, 60.076]
  - text: そのうちに私みたいにね 怖いものなんてなくなるの
    time: [60.076, 66.65]
  - text: 一度きりの人生だから おいしい思いをしましょうね
    time: [66.65, 72.963]
  - text: 前かごのエコバッグの苺フラッペは溶けていた
    time: [73.53, 79.627]
  - text: おばさんのデザートの苺フラッペは溶けていた
    time: [79.627, 85.708]
  - text: 不幸自慢のアル中とシラフでケンカした帰り道
    time: [111.707, 117.813]
  - text: 人生ツマミにしけてんな 酒をツマミに明日もがんばろうぜ
    time: [117.813, 124.523]
  - text: 最後に負けたら台なしね 最後までやれなきゃ能無しだ
    time: [124.523, 130.673]
