lines:
  - text: マキちゃんは実家に帰って魔法使いになったらしい
    tl: 마키짱은 본가에 돌아가 마법사가 됐대
    time: [32.637, 36.782]
  - text: 友達の友達の友達が言ってた
    tl: 친구의 친구의 친구가 말했어
    time: [36.792, 40.32]
  - text: 正解はなかった でも誰も間違えてはなかった
    tl: 정답은 없었어, 하지만 누구도 틀리지 않았어
    time: [40.658, 45.106]
  - text: ねえ? そうだね
    tl: 그렇지? 그렇네
    time: [45.396, 47.306]
  - text: マキちゃんは実家に帰って魔法使いになったらしい
    tl: 마키짱은 본가에 돌아가 마법사가 됐대
    time: [48.592, 52.7]
  - text: 別に仲良くはなかったんだけどさ
    tl: 딱히 친하진 않았지만 말이야
    time: [52.71, 56.251]
  - text: 久しぶりに飲んだ 炭酸水で喉が痛くなった
    tl: 오랜만에 마신 탄산수에 목이 아파졌어
    time: [56.571, 61.653]
  - text: 飲み切れないや
    tl: 다 못 마시겠어
    time: [62.188, 65.199]
  - text: パーティは終わりました 見えないところで散った花びら
    tl: 파티는 끝났습니다, 보이지 않는 곳에서 진 꽃잎
    time: [80.65, 84.219]
  - text: 酷い話だ 所構わず騒いだみんな ふと 気付いてしまった
    tl: 너무한 이야기야, 아무 데서나 떠들던 모두가 문득 깨달았어
    time: [84.229, 88.401]
  - text: イノベーション これはシンコペーション
    tl: 이노베이션, 이건 싱커페이션
    time: [88.411, 90.312]
