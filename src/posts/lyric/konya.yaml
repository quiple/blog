    tl: 오늘 밤도 많이 많이 보고 싶어, 보고 싶어
    time: [61.976, 66.654]
  - text: 君の声や仕草も
    pr: 키미노코에야시구사모
    tl: 네 목소리와 몸짓도
    time: [66.664, 70.167]
