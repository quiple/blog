lines:
  - text: 夏の上昇気流が僕を少し蝕んでて
    pr: 나츠노조쇼키류가보쿠오스코시무시반데테
    tl: 여름의 상승 기류가 나를 조금씩 갉아먹고
    time: [0.26, 4.277]
  - text: 君は不機嫌そうにね
    pr: 키미와후키겐소니네
    tl: 너는 언짢은 듯이
    time: [4.287, 5.974]
  - text: 僕の手を突っぱねて行く
    pr: 보쿠노테오츳파네테이쿠
    tl: 내 손을 뿌리치고 가
    time: [5.984, 8.295]
  - text: 滲んでいく思い出が流されるように
    pr: 니진데이쿠오모이데가나가사레루요니
    tl: 번져 가는 추억이 떠내려가듯
    time: [8.305, 12.612]
  - text: さよならもしないで
    pr: 사요나라모시나이데
    tl: 작별 인사도 하지 않고
    time: [14.371, 16.805]
  - text: 夏の上昇気流で僕は雨に打たれて
    pr: 나츠노조쇼키류데보쿠와아메니우타레테
    tl: 여름의 상승 기류로 나는 비를 맞고
    time: [31.844, 35.651]
  - text: 染まっていく空に不確かな愛を求めて
    pr: 소맛테이쿠소라니후타시카나아이오모토메테
    tl: 물들어 가는 하늘에 불확실한 사랑을 바라며
    time: [35.711, 39.379]
  - text: 色褪せることを楽しんでいるように
    pr: 이로아세루코토오타노신데이루요니
    tl: 빛바래는 걸 즐기기라도 하듯
    time: [39.63, 43.674]
  - text: ｢さよなら｣だとか
    pr: '"사요나라"다토카'
    tl: '"안녕"이라든가'
    time: [45.365, 47.66]
  - text: ぐだぐた泣いて喚いたりしたら
    pr: 구다구타나이테와메이타리시타라
    tl: 구질구질하게 울고 소리치면
    time: [47.67, 51.624]
  - text: 馬鹿にされてしまうからさ
    pr: 바카니사레테시마우카라사
    tl: 비웃음을 사고 말 테니까
    time: [51.634, 55.302]
  - text: ｢こんな日々に嫌気が刺した｣と
    pr: '"콘나히비니이야케가사시타"토'
    tl: '"이런 나날에 싫증이 났어"라며'
    time: [55.542, 59.376]
  - text: ぱっと立ち去って
    pr: 팟토타치삿테
    tl: 휙 떠나 버리고
    time: [59.386, 61.739]
  - text: 今夜もいっぱいいっぱい見たい見たい
