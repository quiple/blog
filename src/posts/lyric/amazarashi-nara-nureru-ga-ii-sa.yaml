lines:
  - text: コンクリートの隙間から顔出した
    time: [26.48, 32.69]
  - text: 草の様な花の様な
    time: [32.69, 39.15]
  - text: 「なんだってかんだったって知らないよ」
    time: [39.15, 45.34]
  - text: なんでもねぇやと突っ立っている
    time: [45.34, 50.94]
  - text: 『雨曝しなら濡れるがいいさ
    time: [50.94, 57.34]
  - text: だって、どうせ傘など持って無いんだ
    time: [57.34, 63.94]
  - text: 時が来たなら終わるもいいさ
    time: [63.94, 70.08]
  - text: それが俺の最後の運命だったら
    time: [70.08, 75.75]
  - text: その時、瞼に吹く風も見えるだろう
    time: [75.75, 85.81]
  - text: 静かに揺れるだろう
    time: [85.81, 118.57]
  - text: 吐き出した溜め息は干涸びて
    time: [118.57, 124.42]
  - text: 鳥達が啄んでいったよ
    time: [124.42, 131.22]
  - text: 雲が誘いに来るけれど
    time: [131.22, 137.14]
  - text: 君の背中には乗れないもんな
    time: [137.14, 142.76]
  - text: 雪が降ったら泣いてやるのさ
    time: [142.76, 149.17]
  - text: 涙がちょっとの雪なら溶かしちまうだろう
    time: [149.17, 155.59]
  - text: 凍りついたら怒りを燃やす
    time: [155.59, 161.98]
  - text: それが全ての景色を燃やしちまうだろう
    time: [161.98, 167.52]
  - text: その時、心も焼け焦げてしまうだろう
    time: [167.52, 177.62]
  - text: 煙と変わるだろう
    time: [177.62, 184.08]
  - text: 生まれた日から
    time: [184.08, 190.38]
  - text: 後ろは無いさ
    time: [190.38, 196.9]
  - text: 広がる世界が在るばかり
    time: [196.9, 202.6]
  - text: 見据えてやるさ
    time: [202.6, 234.36]
  - text: 強がりばかり並べてやれば
    time: [234.36, 240.13]
  - text: ホラ雨雲さえも逃げ出す気配
    time: [240.13, 246.26]
  - text: 時が来たなら消えるもいいさ
    time: [246.26, 252.52]
  - text: それが俺の最後の運命だったら
    time: [252.52, 258.05]
  - text: その時、瞼に吹く風も見えるだろう
    time: [258.05, 268.15]
  - text: 静かに揺れるだろう』
    time: [268.15, 275.48]
