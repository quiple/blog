title: バンジー!
titleTl: 번지!
titleLang: ja
year: '2019'
artist: pop-never-dies
lang: ja
sp: 50nXwTfqn86qPb6hDOvvzB
yt:
  audio: ysHHIrKBwhY
lines:
  - text: 純情気取っていいじゃない
    pr: 준조키돗테이이자나이
    tl: 순진한 척해도 괜찮잖아
    time: [12.833, 14.994]
  - text: それも結婚前夜のリハみたい
    pr: 소레모켓콘젠야노리하미타이
    tl: 그것도 결혼 전날 밤의 리허설 같아
    time: [14.994, 17.864]
  - text: 声をあげないないないないなら
    pr: 코에오아게나이나이나이나이나라
    tl: 소리를 안, 안, 안, 안 낼 거라면
    time: [17.864, 20.375]
  - text: 決めたこと紐の長さ15メートル
    pr: 키메타코토히모노나가사주고메토루
    tl: 정했어, 줄의 길이는 15미터
    time: [20.375, 23.705]
  - text: 信心深さは両親揃って確かなもんだと思います
    pr: 신진부카사와료신소롯테타시카나몬다토오모이마스
    tl: 신앙심만큼은 부모님 두 분 다 확실하다고 생각해요
    time: [23.705, 28.81]
  - text: 信じられないないならきっと大事なものなんて
    pr: 신지라레나이나이나라킷토다이지나모노난테
    tl: 믿을 수 없다, 없다면 분명 소중한 것 따윈
    time: [28.81, 33.068]
  - text: 無いんでしょうね
    pr: 나인데쇼네
    tl: 없는 거겠죠
    time: [33.068, 34.795]
  - text: あーそれって意味がない
    pr: 아소렛테이미가나이
    tl: 아, 그건 의미가 없어
    time: [34.795, 37.067]
  - text: わたしみんなが好きなら好きじゃない
    pr: 아타시민나가스키나라스키자나이
    tl: 난 모두가 좋아한다면 좋아하지 않아
    time: [37.067, 40.26]
  - text: あーそれって意味がない
    pr: 아소렛테이미가나이
    tl: 아, 그건 의미가 없어
    time: [40.26, 42.512]
  - text: わたし足が震えても
    pr: 아타시아시가후루에테모
    tl: 난 다리가 떨려도
    time: [42.512, 47.142]
  - text: 危険は無いよコレを持って
    pr: 키켄와나이요코레오못테
    tl: 위험하진 않아, 이걸 잡아
    time: [55.343, 57.625]
  - text: 注意事項を沢山守れば
    pr: 추이지코오타쿠산마모레바
    tl: 수많은 주의 사항을 지키면
    time: [57.625, 60.332]
  - text: わたし泣かないないから
    pr: 아타시나카나이나이카라
    tl: 난 안, 안 울 테니까
    time: [60.332, 62.218]
  - text: 愛と勇気と怒りを胸に先に立つ
    pr: 아이토유키토이카리오무네니사키니타츠
    tl: 사랑과 용기와 분노를 가슴에 품고 앞에 서
    time: [62.218, 66.248]
  - text: 秘め事なんてもうダサくて
    pr: 히메고토난테모다사쿠테
    tl: 비밀스러운 일 같은 건 이제 촌스러워서
    time: [66.248, 68.635]
  - text: 前を向いて両手を横にして
    pr: 마에오무이테료테오요코니시테
    tl: 앞을 보고 두 팔을 옆으로 벌리고
    time: [68.635, 71.308]
  - text: ごめんやっぱり無理かもなんて
    pr: 고멘얏파리무리카모난테
    tl: 미안, 역시 무리일지도 모른다며
    time: [71.308, 73.747]
  - text: 時にはぶっ飛んじゃって叫んでる
    pr: 토키니와붓톤잣테사켄데루
    tl: 때로는 정신이 나가 버려 소리치고 있어
    time: [73.747, 77.272]
  - text: あーそれって意味がない
    pr: 아소렛테이미가나이
    tl: 아, 그건 의미가 없어
    time: [77.272, 79.59]
  - text: 明日やることあるから残れない
    pr: 아시타야루코토아루카라노코레나이
    tl: 내일 할 일이 있어서 남을 수 없어
    time: [79.59, 82.778]
  - text: あーそれって意味がない
    pr: 아소렛테이미가나이
    tl: 아, 그건 의미가 없어
    time: [82.778, 85.061]
  - text: わたし喉が枯れてもしがみついて
    pr: 아타시노도가카레테모시가미츠이테
    tl: 난 목이 쉬어도 매달려서
    time: [85.061, 88.235]
  - text: あーそれって意味がない
    pr: 아소렛테이미가나이
    tl: 아, 그건 의미가 없어
    time: [88.235, 90.53]
  - text: わたしみんなが好きなら好きじゃない
    pr: 아타시민나가스키나라스키자나이
    tl: 난 모두가 좋아한다면 좋아하지 않아
    time: [90.53, 93.755]
  - text: あーそれって意味がない
    pr: 아소렛테이미가나이
    tl: 아, 그건 의미가 없어
    time: [93.755, 96.033]
  - text: わたし愛されたくても
    pr: 아타시아이사레타쿠테모
    tl: 난 사랑받고 싶어도
    time: [96.033, 100.623]
  - text: ねえ聞いて恋をして
    pr: 네키이테코이오시테
    tl: 있잖아, 들어 봐, 사랑을 하고
    time: [119.794, 122.052]
  - text: それで報われないなら
    pr: 소레데무쿠와레나이나라
    tl: 그래도 보답받지 못한다면
    time: [122.052, 125.28]
  - text: ねえ聞いてどうしても
    pr: 네키이테도시테모
    tl: 있잖아, 들어 봐, 아무리 해도
    time: [125.28, 127.589]
  - text: 涙止められなくても
    pr: 나미다토메라레나쿠테모
    tl: 눈물을 멈출 수 없어도
    time: [127.589, 130.774]
  - text: ねえ聞いて振り絞って
    pr: 네키이테후리시봇테
    tl: 있잖아, 들어 봐, 힘껏 짜내고
    time: [130.774, 132.956]
  - text: それも実らないのなら
    pr: 소레모미노라나이노나라
    tl: 그것도 결실을 맺지 못한다면
    time: [132.956, 136.273]
  - text: ねえ聞いて目を閉じて
    pr: 네키이테메오토지테
    tl: 있잖아, 들어 봐, 눈을 감고
    time: [136.273, 138.483]
  - text: 三歩進んで空に飛び降りろ！
    pr: 산포스슨데소라니토비오리로!
    tl: 세 걸음 나아가 하늘로 뛰어내려!
