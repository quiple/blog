lines:
  - text: Been so long since I felt a connection
    tl: 유대감을 느낀 지 너무 오래됐어
  - text: Cause I always feel like the exception
    tl: 난 언제나 예외처럼 느껴지거든
  - text: Whenever they tell me
    tl: 그들이 내게 말할 때마다
  - text: I'm who I'm meant to be
    tl: 내가 되어야 할 모습이 바로 나라고
  - text: So save me your story
    tl: 그러니 네 이야기는 넣어 둬
  - text: It's all a cliche
    tl: 전부 뻔한 말이야
  - text: I ain't looking for a life that's flawless
    tl: 난 완벽한 삶을 찾는 게 아니야
  - text: All I really want is something honest
