lines:
  - text: I used to have such lofty goals when I was a child
    tl: 어릴 적엔 원대한 꿈이 있었어
    time: [11.99, 17.48]
  - text: But now I scroll my phone all day without going outside
    tl: 하지만 이젠 밖에도 나가지 않고 온종일 휴대폰만 들여다봐
    time: [17.48, 22.97]
  - text: Where did my motivation go? Did it waddle away?
    tl: 내 의욕은 어디로 갔을까? 뒤뚱뒤뚱 도망가 버렸나?
    time: [22.97, 28.45]
  - text: The weeks fly by as my mind starts to decline and decay
    tl: 몇 주가 쏜살같이 지나는 동안 내 정신은 쇠하고 썩어 가
    time: [28.45, 34.28]
  - text: I tell everybody I'm a silly little goose
    tl: 모두에게 난 바보 같은 꼬마 거위라고 말해
    time: [34.28, 39.42]
  - text: But really, I'm too scared to let my thoughts out on the loose
    tl: 하지만 사실 속마음을 털어놓기가 너무 두려울 뿐이야
    time: [39.42, 44.91]
  - text: I'm such a useless piece of shit I can't make an excuse
    tl: 난 변명조차 할 수 없는 쓸모없는 쓰레기야
    time: [44.91, 50.39]
  - text: And every day's a struggle to force myself to push through
    tl: 하루하루 억지로 버텨 내는 것만으로도 힘겨워
    time: [50.39, 56.39]
  - text: Is it even still worth to really try?
    tl: 아직도 정말 노력할 가치가 있을까?
    time: [56.39, 59.14]
  - text: "'Cause there's no light or life left in my eyes"
    tl: 내 눈에는 빛도 생기도 남아 있지 않으니까
    time: [59.14, 61.88]
  - text: A goose like me will never touch the sky
    tl: 나 같은 거위는 절대 하늘에 닿지 못할 거야
    time: [61.88, 64.62]
  - text: As long as I'm alive
    tl: 내가 살아 있는 한
    time: [64.62, 66.85]
  - text: I trip and I fall
    tl: 난 걸려 넘어지고
    time: [66.85, 69.25]
  - text: But there's nothing here at all
    tl: 하지만 여기엔 아무것도 없어
    time: [69.25, 72.34]
  - text: For my faults, flaws, and failures, I still fight
    tl: 내 잘못과 결점과 실패에도 난 여전히 싸워
    time: [72.34, 77.14]
  - text: But I don't know why
    tl: 하지만 왜 그러는지 모르겠어
    time: [77.14, 79.54]
  - text: I just fuck up, fuck up, and up, fuck up
    tl: 난 그저 망치고 망치고 또 망치고 또 망쳐
    time: [88.79, 91.19]
  - text: Oh, I wish I could leave here
