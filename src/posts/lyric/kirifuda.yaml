lines:
  - text: さあ今だ、かざせよ切り札。
    time: [0.893, 1.542]
  - text: この未来は君のものさ!
    time: [5.667, 5.999]
  - text: ぎらぎら燃えてる。
    time: [19.73, 20.348]
  - text: 醒めない夢でも見ているように。
    time: [22.14, 22.473]
  - text: 身体が求める。
    time: [24.8, 25.083]
  - text: 強い奴が居る場所を。
    time: [27.104, 27.354]
  - text: クラクラ揺れてる。
    time: [29.728, 30.011]
  - text: 確かなものなどここには無いから
    time: [32.261, 32.612]
  - text: ただただ求める。
    time: [34.84, 35.157]
  - text: 力の溢れる場所を。
    time: [36.975, 37.272]
  - text: 次の戦いが僕を待ってる。
    time: [39.829, 40.145]
  - text: 新しい日々の合図が聴こえる。
    time: [44.804, 45.153]
  - text: さあ今だ、かざせよ切り札。
    time: [51.171, 51.538]
  - text: この未来は君のものさ!
    time: [56.067, 56.4]
  - text: その笑顔で世界を揺らせば
    time: [61.154, 61.537]
  - text: その後は自分次第だよ。
    time: [66.336, 66.621]
  - text: ダラダラ続ける
    time: [78.998, 79.347]
  - text: 日々には少しも味気が無いから
    time: [82.729, 83.027]
  - text: 身体を委ねろ。刺激的な混沌に。
    time: [85.407, 85.705]
  - text: ビリビリ痺れる。
    time: [90.297, 90.582]
  - text: アドレナリンは放出しっぱなし。
    time: [92.781, 93.131]
  - text: ワクワクしている。
    time: [95.544, 95.776]
  - text: これから起こるリアルに。
    time: [97.643, 97.892]
  - text: さあ今だ。大きく踏み込め。
    time: [100.575, 100.892]
  - text: 夜の中に置いていかれぬように。
    time: [105.483, 105.8]
  - text: その希望とシンクロしたなら、
    time: [110.605, 110.939]
  - text: きっとすぐに光はあるよ。
    time: [115.479, 115.757]
  - text: 果てなき旅路を
    time: [125.729, 126.262]
  - text: ただひたすらに進んで、
    time: [128.205, 128.537]
  - text: 行くべき方向を
    time: [130.75, 130.999]
  - text: 見失いそうになっても、
    time: [133.244, 133.494]
  - text: 運命なんて言葉は信じるな。
    time: [135.902, 136.168]
  - text: オーケー、君の思うままで。
    time: [140.834, 141.131]
  - text: 過去の苦しみもどんな後悔も、
    time: [150.947, 151.346]
  - text: 新しい日々が受け入れてくれる!
    time: [156.068, 156.435]
  - text: だから今だ、感情のままに
    time: [162.277, 162.96]
  - text: その想いを解き放てよ。
    time: [167.989, 168.239]
  - text: その笑顔で世界を揺らせば
    time: [173.398, 173.698]
  - text: その後は自分次第だよ
    time: [178.079, 178.364]
  - text: さあ今だ、かざせよ切り札。
    time: [183.061, 183.411]
  - text: この未来は君のものさ。
    time: [187.471, 187.821]
  - text: 描き出せ、その物語を。
    time: [192.691, 192.991]
  - text: 君こそが主人公だろう?
    time: [197.722, 198.005]
