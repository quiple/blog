lines:
  - text: さあ今だ、かざせよ切り札。
    time: [0.893, 1.542]
    tl: 자, 지금이야, 비장의 패를 들어라
  - text: この未来は君のものさ!
    time: [5.667, 5.999]
    tl: 이 미래는 네 것이야!
  - text: ぎらぎら燃えてる。
    time: [19.73, 20.348]
    tl: 이글이글 타오르고 있어
  - text: 醒めない夢でも見ているように。
    time: [22.14, 22.473]
    tl: 깨어나지 않는 꿈이라도 꾸는 듯이
  - text: 身体が求める。
    time: [24.8, 25.083]
    tl: 몸이 원해
  - text: 強い奴が居る場所を。
    time: [27.104, 27.354]
    tl: 강한 자가 있는 곳을
  - text: クラクラ揺れてる。
    time: [29.728, 30.011]
    tl: 어질어질 흔들려
  - text: 確かなものなどここには無いから
    time: [32.261, 32.612]
    tl: 확실한 것 따윈 여기 없으니까
  - text: ただただ求める。
    time: [34.84, 35.157]
    tl: 그저 원해
  - text: 力の溢れる場所を。
    time: [36.975, 37.272]
    tl: 힘이 넘치는 곳을
  - text: 次の戦いが僕を待ってる。
    time: [39.829, 40.145]
    tl: 다음 싸움이 나를 기다려
  - text: 新しい日々の合図が聴こえる。
    time: [44.804, 45.153]
    tl: 새로운 날들의 신호가 들려
  - text: さあ今だ、かざせよ切り札。
    time: [51.171, 51.538]
    tl: 자, 지금이야, 비장의 패를 들어라
  - text: この未来は君のものさ!
    time: [56.067, 56.4]
    tl: 이 미래는 네 것이야!
  - text: その笑顔で世界を揺らせば
    time: [61.154, 61.537]
    tl: 그 미소로 세상을 흔들면
  - text: その後は自分次第だよ。
    time: [66.336, 66.621]
    tl: 그다음은 너 하기 나름이야
  - text: ダラダラ続ける
    time: [78.998, 79.347]
    tl: 질질 이어지는
  - text: 日々には少しも味気が無いから
    time: [82.729, 83.027]
    tl: 나날은 조금도 재미없으니
  - text: 身体を委ねろ。刺激的な混沌に。
    time: [85.407, 85.705]
    tl: 몸을 맡겨, 자극적인 혼돈에
  - text: ビリビリ痺れる。
    time: [90.297, 90.582]
    tl: 찌릿찌릿 저려 와
  - text: アドレナリンは放出しっぱなし。
    time: [92.781, 93.131]
    tl: 아드레날린은 계속 쏟아져 나와
  - text: ワクワクしている。
    time: [95.544, 95.776]
    tl: 두근거리고 있어
  - text: これから起こるリアルに。
    time: [97.643, 97.892]
    tl: 앞으로 일어날 현실에
  - text: さあ今だ。大きく踏み込め。
    time: [100.575, 100.892]
    tl: 자, 지금이야, 크게 내디뎌
  - text: 夜の中に置いていかれぬように。
    time: [105.483, 105.8]
    tl: 밤속에 뒤처지지 않도록
  - text: その希望とシンクロしたなら、
    time: [110.605, 110.939]
    tl: 그 희망과 동기화되면
  - text: きっとすぐに光はあるよ。
    time: [115.479, 115.757]
    tl: 분명 곧 빛이 있을 거야
  - text: 果てなき旅路を
    time: [125.729, 126.262]
    tl: 끝없는 여정을
  - text: ただひたすらに進んで、
    time: [128.205, 128.537]
    tl: 그저 한결같이 나아가
  - text: 行くべき方向を
    time: [130.75, 130.999]
    tl: 가야 할 방향을
  - text: 見失いそうになっても、
    time: [133.244, 133.494]
    tl: 잃을 것 같아져도
  - text: 運命なんて言葉は信じるな。
    time: [135.902, 136.168]
    tl: 운명 같은 말은 믿지 마
  - text: オーケー、君の思うままで。
    time: [140.834, 141.131]
    tl: 오케이, 네가 생각하는 대로
  - text: 過去の苦しみもどんな後悔も、
    time: [150.947, 151.346]
    tl: 지난 괴로움도 어떤 후회도
  - text: 新しい日々が受け入れてくれる!
    time: [156.068, 156.435]
    tl: 새로운 날들이 받아 줄 거야!
  - text: だから今だ、感情のままに
    time: [162.277, 162.96]
    tl: 그러니 지금이야, 감정대로
  - text: その想いを解き放てよ。
    time: [167.989, 168.239]
    tl: 그 마음을 풀어 줘
  - text: その笑顔で世界を揺らせば
    time: [173.398, 173.698]
    tl: 그 미소로 세상을 흔들면
  - text: その後は自分次第だよ
    time: [178.079, 178.364]
    tl: 그다음은 너 하기 나름이야
  - text: さあ今だ、かざせよ切り札。
    time: [183.061, 183.411]
    tl: 자, 지금이야, 비장의 패를 들어라
  - text: この未来は君のものさ。
    time: [187.471, 187.821]
    tl: 이 미래는 네 것이야
  - text: 描き出せ、その物語を。
    time: [192.691, 192.991]
    tl: 그려 내, 그 이야기를
  - text: 君こそが主人公だろう?
    time: [197.722, 198.005]
    tl: 네가 바로 주인공이잖아?
