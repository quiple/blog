lines:
  - text: さあ今だ、かざせよ切り札
    pr: 사이마다, 카자세요키리후다
    tl: 자, 지금이야, 비장의 패를 들어
    time: [0.893, 1.542]
  - text: この未来は君のものさ!
    pr: 코노미라이와키미노모노사!
    tl: 이 미래는 네 거야!
    time: [5.667, 5.999]
  - text: ぎらぎら燃えてる
    pr: 기라기라모에테루
    tl: 이글이글 타오르고 있어
    time: [19.73, 20.348]
  - text: 醒めない夢でも見ているように
    pr: 사메나이유메데모미테이루요니
    tl: 깨어나지 않는 꿈이라도 꾸는 듯이
    time: [22.14, 22.473]
  - text: 身体が求める
    pr: 신타이가모토메루
    tl: 몸이 원해
    time: [24.8, 25.083]
  - text: 強い奴が居る場所を
    pr: 츠요이야츠가이루바쇼오
    tl: 강한 자가 있는 곳을
    time: [27.104, 27.354]
  - text: クラクラ揺れてる
    pr: 쿠라쿠라유레테루
    tl: 어질어질 흔들려
    time: [29.728, 30.011]
  - text: 確かなものなどここには無いから
    pr: 타시카나모노나도코코니와나이카라
    tl: 확실한 것 따윈 여기 없으니까
    time: [32.261, 32.612]
  - text: ただただ求める
    pr: 타다타다모토메루
    tl: 그저 원해
    time: [34.84, 35.157]
  - text: 力の溢れる場所を
    pr: 치카라노아후레루바쇼오
    tl: 힘이 넘치는 곳을
    time: [36.975, 37.272]
  - text: 次の戦いが僕を待ってる
    pr: 츠기노타타카이가보쿠오맛테루
    tl: 다음 싸움이 나를 기다려
    time: [39.829, 40.145]
  - text: 新しい日々の合図が聴こえる
    pr: 아타라시이히비노아이즈가키코에루
    tl: 새로운 날들의 신호가 들려
    time: [44.804, 45.153]
  - text: さあ今だ、かざせよ切り札
    pr: 사이마다, 카자세요키리후다
    tl: 자, 지금이야, 비장의 패를 들어
    time: [51.171, 51.538]
  - text: この未来は君のものさ!
    pr: 코노미라이와키미노모노사!
    tl: 이 미래는 네 거야!
    time: [56.067, 56.4]
  - text: その笑顔で世界を揺らせば
    pr: 소노에가오데세카이오유라세바
    tl: 그 미소로 세상을 흔들면
    time: [61.154, 61.537]
  - text: その後は自分次第だよ
    pr: 소노고와지분시다이다요
    tl: 그다음은 너 하기 나름이야
    time: [66.336, 66.621]
  - text: ダラダラ続ける
    pr: 다라다라츠즈케루
    tl: 질질 이어지는
    time: [78.998, 79.347]
  - text: 日々には少しも味気が無いから
    pr: 히비니와스코시모아지케가나이카라
    tl: 나날은 조금도 재미없으니
    time: [82.729, 83.027]
  - text: 身体を委ねろ。刺激的な混沌に
    pr: 신타이오유다네로. 시게키테키나콘톤니
    tl: 몸을 맡겨, 자극적인 혼돈에
    time: [85.407, 85.705]
  - text: ビリビリ痺れる
    pr: 비리비리시비레루
    tl: 찌릿찌릿 저려 와
    time: [90.297, 90.582]
  - text: アドレナリンは放出しっぱなし
    pr: 아도레나린와호슈츠싯파나시
    tl: 아드레날린은 계속 쏟아져 나와
    time: [92.781, 93.131]
  - text: ワクワクしている
    pr: 와쿠와쿠시테이루
    tl: 두근거리고 있어
    time: [95.544, 95.776]
  - text: これから起こるリアルに
    pr: 코레카라오코루리아루니
    tl: 앞으로 일어날 현실에
    time: [97.643, 97.892]
  - text: さあ今だ。大きく踏み込め
    pr: 사이마다. 오키쿠후미코메
    tl: 자, 지금이야, 크게 내디뎌
    time: [100.575, 100.892]
  - text: 夜の中に置いていかれぬように
    pr: 요루노나카니오이테이카레누요니
    tl: 밤속에 뒤처지지 않도록
    time: [105.483, 105.8]
  - text: その希望とシンクロしたなら、
    pr: 소노키보토신쿠로시타나라,
    tl: 그 희망과 동기화되면
    time: [110.605, 110.939]
  - text: きっとすぐに光はあるよ
    pr: 킷토스구니히카리와아루요
    tl: 분명 곧 빛이 있을 거야
    time: [115.479, 115.757]
  - text: 果てなき旅路を
    pr: 하테나키타비지오
    tl: 끝없는 여정을
    time: [125.729, 126.262]
  - text: ただひたすらに進んで、
    pr: 타다히타스라니스슨데,
    tl: 그저 한결같이 나아가
    time: [128.205, 128.537]
  - text: 行くべき方向を
    pr: 이쿠베키호코오
    tl: 가야 할 방향을
    time: [130.75, 130.999]
  - text: 見失いそうになっても、
    pr: 미우시나이소니낫테모,
    tl: 잃을 것 같아져도
    time: [133.244, 133.494]
  - text: 運命なんて言葉は信じるな
    pr: 운메이난테코토바와신지루나
    tl: 운명 같은 말은 믿지 마
    time: [135.902, 136.168]
  - text: オーケー、君の思うままで
    pr: 오케, 키미노오모우마마데
    tl: 오케이, 네가 생각하는 대로
    time: [140.834, 141.131]
  - text: 過去の苦しみもどんな後悔も、
    pr: 카코노쿠루시미모돈나코카이모,
    tl: 지난 괴로움도 어떤 후회도
    time: [150.947, 151.346]
  - text: 新しい日々が受け入れてくれる!
    pr: 아타라시이히비가우케이레테쿠레루!
    tl: 새로운 날들이 받아 줄 거야!
    time: [156.068, 156.435]
  - text: だから今だ、感情のままに
    pr: 다카라이마다, 칸조노마마니
    tl: 그러니 지금이야, 감정대로
    time: [162.277, 162.96]
  - text: その想いを解き放てよ
    pr: 소노오모이오토키하나테요
    tl: 그 마음을 풀어 줘
    time: [167.989, 168.239]
  - text: その笑顔で世界を揺らせば
    pr: 소노에가오데세카이오유라세바
    tl: 그 미소로 세상을 흔들면
    time: [173.398, 173.698]
  - text: その後は自分次第だよ
    pr: 소노고와지분시다이다요
    tl: 그다음은 너 하기 나름이야
    time: [178.079, 178.364]
  - text: さあ今だ、かざせよ切り札
    pr: 사이마다, 카자세요키리후다
    tl: 자, 지금이야, 비장의 패를 들어
    time: [183.061, 183.411]
  - text: この未来は君のものさ
    pr: 코노미라이와키미노모노사
    tl: 이 미래는 네 거야
    time: [187.471, 187.821]
  - text: 描き出せ、その物語を
    pr: 에가키다세, 소노모노가타리오
    tl: 그려 내, 그 이야기를
    time: [192.691, 192.991]
  - text: 君こそが主人公だろう?
    pr: 키미코소가슈진코다로?
    tl: 네가 바로 주인공이잖아?
    time: [197.722, 198.005]
