lines:
  - text: 正気になって
    tl: 제정신이 되어
  - text: ひとりぼっちに気づいてしまうなら
    tl: 혼자라는 걸 깨닫고 만다면
  - text: もう正気でなんかいられなくていい
    tl: 더는 제정신으로 있지 않아도 돼
  - text: 愛されちゃうと
    tl: 사랑받으면
  - text: 離れてゆくこと恐れてしまうなら
    tl: 떠나가는 게 두려워진다면
  - text: 愛される努力やめてみたっていい
    tl: 사랑받으려는 노력을 그만둬도 돼
  - text: 誰かが話している声全部
    tl: 누군가 이야기하는 목소리가 전부
  - text: ノイズに聴こえるなら
    tl: 소음으로 들린다면
  - text: ヘッドホンしてロックを聴いたらいい
    tl: 헤드폰을 쓰고 록을 들으면 돼
  - text: 電気を消す時
    tl: 불을 끌 때
  - text: 嫌な予感が押し寄せてしまうなら
    tl: 불길한 예감이 밀려온다면
  - text: このまま朝を待ちぼうけたっていい
    tl: 이대로 하염없이 아침을 기다려도 돼
  - text: いつも
    tl: 언제나
  - text: どうして?のクエスチョンマーク
    tl: 왜? 라는 물음표
  - text: 可愛いあの子も隠してるかな?
    tl: 그 귀여운 애도 숨기고 있을까?
  - text: 誰だって持ち合わせている
    tl: 누구에게나 있다는 걸
  - text: なんて
    tl: 그냥
  - text: 丸ごと認めるの難しいわ
    tl: 통째로 인정하기는 어려워
  - text: すてきなひとりぼっち達よ
    tl: 멋진 외톨이들이여
  - text: 大事にしたいものをかき集めて
    tl: 소중히 여기고 싶은 것을 그러모아
  - text: いつでも大きな夢をみる
    tl: 언제나 큰 꿈을 꿔
  - text: 掴めないとかもう気にしないで
    tl: 붙잡을 수 없다는 건 이제 신경 쓰지 마
  - text: すてきなひとりぼっち達よ
    tl: 멋진 외톨이들이여
  - text: “わたし"を守る孤独な呪い
    tl: '"나"를 지키는 고독한 저주'
  - text: 役に立つかわからないけど
    tl: 도움이 될지는 모르지만
  - text: ここで歌ってあげるよ
    tl: 여기서 노래해 줄게
