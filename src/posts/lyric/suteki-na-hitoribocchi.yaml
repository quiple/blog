title: すてきなひとりぼっち
titleTl: 멋진 외톨이
titleLang: ja
year: '2023'
artist: hikari-no-naka-ni
lang: ja
sp: 5rVwCgcJ6ZcclECvGgwWLo
yt:
  audio: 0d8hmG9ZhR8
lines:
  - text: 正気になって
    pr: 쇼키니낫테
    tl: 제정신이 되어
  - text: ひとりぼっちに気づいてしまうなら
    pr: 히토리봇치니키즈이테시마우나라
    tl: 혼자라는 걸 깨닫고 만다면
  - text: もう正気でなんかいられなくていい
    pr: 모쇼키데난카이라레나쿠테이이
    tl: 더는 제정신으로 있지 않아도 돼
  - text: 愛されちゃうと
    pr: 아이사레차우토
    tl: 사랑받으면
  - text: 離れてゆくこと恐れてしまうなら
    pr: 하나레테유쿠코토오소레테시마우나라
    tl: 떠나가는 게 두려워진다면
  - text: 愛される努力やめてみたっていい
    pr: 아이사레루도료쿠야메테미탓테이이
    tl: 사랑받으려는 노력을 그만둬도 돼
  - text: 誰かが話している声全部
    pr: 다레카가하나시테이루코에젠부
    tl: 누군가 이야기하는 목소리가 전부
  - text: ノイズに聴こえるなら
    pr: 노이즈니키코에루나라
    tl: 소음으로 들린다면
  - text: ヘッドホンしてロックを聴いたらいい
    pr: 헷도혼시테롯쿠오키이타라이이
    tl: 헤드폰을 쓰고 록을 들으면 돼
  - text: 電気を消す時
    pr: 덴키오케스토키
    tl: 불을 끌 때
  - text: 嫌な予感が押し寄せてしまうなら
    pr: 이야나요칸가오시요세테시마우나라
    tl: 불길한 예감이 밀려온다면
  - text: このまま朝を待ちぼうけたっていい
    pr: 코노마마아사오마치보케탓테이이
    tl: 이대로 하염없이 아침을 기다려도 돼
  - text: いつも
    pr: 이츠모
    tl: 언제나
  - text: どうして?のクエスチョンマーク
    pr: 도시테?노쿠에스촌마쿠
    tl: 왜? 라는 물음표
  - text: 可愛いあの子も隠してるかな?
    pr: 카와이이아노코모카쿠시테루카나?
    tl: 그 귀여운 애도 숨기고 있을까?
  - text: 誰だって持ち合わせている
    pr: 다레닷테모치아와세테이루
    tl: 누구에게나 있다는 걸
  - text: なんて
    pr: 난테
    tl: 그냥
  - text: 丸ごと認めるの難しいわ
    pr: 마루고토미토메루노무즈카시와
    tl: 통째로 인정하기는 어려워
  - text: すてきなひとりぼっち達よ
    pr: 스테키나히토리봇치타치요
    tl: 멋진 외톨이들이여
  - text: 大事にしたいものをかき集めて
    pr: 다이지니시타이모노오카키아츠메테
    tl: 소중히 여기고 싶은 것을 그러모아
  - text: いつでも大きな夢をみる
    pr: 이츠데모오키나유메오미루
    tl: 언제나 큰 꿈을 꿔
  - text: 掴めないとかもう気にしないで
    pr: 츠카메나이토카모키니시나이데
    tl: 붙잡을 수 없다는 건 이제 신경 쓰지 마
  - text: すてきなひとりぼっち達よ
    pr: 스테키나히토리봇치타치요
    tl: 멋진 외톨이들이여
  - text: “わたし"を守る孤独な呪い
    pr: “와타시"오마모루코도쿠나마지나이
    tl: "'나'를 지키는 고독한 주문"
  - text: 役に立つかわからないけど
    pr: 야쿠니타츠카와카라나이케도
    tl: 도움이 될지는 모르지만
  - text: ここで歌ってあげるよ
    pr: 코코데우탓테아게루요
    tl: 여기서 노래해 줄게
  - text: 私は私のために
    pr: 와타시하와타시노타메니
    tl: 나는 나를 위해
  - text: 私はあなたのために
    pr: 와타시하아나타노타메니
    tl: 나는 당신을 위해
  - text: 強くなりたいそれだけなのに
    pr: 츠요쿠나리타이소레다케나노니
    tl: 강해지고 싶어, 그뿐인데
  - text: あなたはあなたのために
    pr: 아나타하아나타노타메니
    tl: 당신은 당신을 위해
  - text: 生きてゆければそれでいい
    pr: 이키테유케레바소레데이이
    tl: 살아갈 수 있다면 그걸로 돼
  - text: また会えればそれでいい
    pr: 마타아에레바소레데이이
    tl: 다시 만날 수 있다면 그걸로 돼
  - text: それだけでいいそれでいい
    pr: 소레다케데이이소레데이이
    tl: 그것만으로 돼, 그걸로 돼
  - text: すてきなひとりぼっち達よ
    pr: 스테키나히토리봇치타치요
    tl: 멋진 외톨이들이여
  - text: 大事にしたいものをかき集めて
    pr: 다이지니시타이모노오카키아츠메테
    tl: 소중히 여기고 싶은 것을 그러모아
  - text: いつでも大きな星にする
    pr: 이츠데모오키나호시니스루
    tl: 언제나 커다란 별로 만들어
  - text: 叶うかな?夢見てもいいかな?
    pr: 카나우카나?유메미테모이이카나?
    tl: 이루어질까? 꿈꿔도 될까?
  - text: すてきなひとりぼっち達よ
    pr: 스테키나히토리봇치타치요
    tl: 멋진 외톨이들이여
  - text: あなたを守る秘密のまじない
    pr: 아나타오마모루히미츠노마지나이
    tl: 당신을 지키는 비밀 주문
  - text: 役に立つかわからないけど
    pr: 야쿠니타츠카와카라나이케도
    tl: 도움이 될지는 모르지만
  - text: ここで歌ってあげるよ
    pr: 코코데우탓테아게루요
    tl: 여기서 노래해 줄게
  - text: ここで歌ってあげるよ
    pr: 코코데우탓테아게루요
    tl: 여기서 노래해 줄게
