lines:
  - text: 昨日話してた話題ばかりが
    pr: 키노하나시테타와다이바카리가
    tl: 어제 나눴던 이야기만
    time: [20.393, 24.893]
  - text: 頭をよぎるこの部屋で
    pr: 아타마오요기루코노헤야데
    tl: 머릿속을 스치는 이 방에서
    time: [25.155, 29.685]
  - text: みるみるうちに
    pr: 미루미루우치니
    tl: 눈 깜짝할 사이에
    time: [29.982, 32.074]
  - text: 置いてけぼりになるようだ
    pr: 오이테케보리니나루요다
    tl: 혼자 뒤처지는 것 같아
    time: [32.239, 34.596]
  - text: つまんねえなでも
    pr: 츠만네나데모
    tl: 재미없네, 그래도
    time: [34.803, 37.1]
  - text: 捨てられないまま
    pr: 스테라레나이마마
    tl: 버리지 못한 채
    time: [37.253, 38.741]
  - text: 爆音ステレオ怒鳴る声
    pr: 바쿠온스테레오도나루코에
    tl: 굉음을 내는 스테레오, 고함치는 목소리
    time: [39.532, 41.611]
  - text: 頭が腐る毎日です
    pr: 아타마가쿠사루마이니치데스
    tl: 머리가 썩는 매일이에요
    time: [41.977, 44.15]
  - text: 隣の席だったあの子だんだん
    pr: 토나리노세키닷타아노코단단
    tl: 옆자리에 앉았던 그 애가 점점
    time: [44.357, 46.667]
  - text: 遠のいてゆく
    pr: 토노이테유쿠
    tl: 멀어져 가
    time: [46.667, 48.906]
  - text: 良きか悪きか
    pr: 요키카와루키카
    tl: 좋은 건지 나쁜 건지
    time: [49.165, 51.201]
  - text: ひとりぼっちな窓の外
    pr: 히토리봇치나마도노소토
    tl: 혼자인 창밖에는
    time: [51.354, 53.682]
  - text: 星がいつもより綺麗だった
    pr: 호시가이츠모요리키레이닷타
    tl: 별이 평소보다 아름다웠어
    time: [53.997, 56.903]
  - text: ブルーユース、ブルーユース
    pr: 부루유스, 부루유스
    tl: 블루 유스, 블루 유스
    time: [58.827, 62.951]
  - text: 間違ってなんかいないって
    pr: 마치갓테난카이나잇테
    tl: 틀리지 않았다고
    time: [63.104, 65.61]
  - text: 言っておくれ
    pr: 잇테오쿠레
    tl: 말해 줘
    time: [65.763, 68.987]
  - text: 最低で、でも最高な
    pr: 사이테이데, 데모사이코나
    tl: 최악이지만 최고인
    time: [69.591, 73.453]
  - text: 安心だけどどこか不安な
    pr: 안신다케도도코카후안나
    tl: 안심되지만 어딘가 불안한
    time: [73.769, 78.312]
  - text: 掻き乱してまたたじろいで、
    pr: 카키미다시테마타타지로이데,
    tl: 휘저어 놓고 또 주춤하며
    time: [78.902, 83.085]
  - text: ねえなにやってんだろう?
    pr: 네나니얏텐다로?
    tl: 있지, 뭘 하고 있는 걸까?
    time: [83.402, 85.609]
  - text: 愛したいものほど疑い深いんだ
    pr: 아이시타이모노호도우타가이부카인다
    tl: 사랑하고 싶은 것일수록 의심하게 돼
    time: [85.763, 88.607]
  - text: 泣きながら笑っている
    pr: 나키나가라와랏테이루
    tl: 울면서 웃고 있어
    time: [88.697, 92.634]
  - text: 徐々に自信は無くなってゆく
    pr: 조조니지신와나쿠낫테유쿠
    tl: 조금씩 자신감은 사라져 가
    time: [92.975, 97.676]
  - text: けど情けなくて頼りないままの
    pr: 케도나사케나쿠테타요리나이마마노
    tl: 하지만 한심하고 미덥지 못한 채인
    time: [97.829, 102.774]
  - text: 僕たちはブルーユース
    pr: 보쿠타치와부루유스
    tl: 우리는 블루 유스
    time: [103.138, 106.954]
