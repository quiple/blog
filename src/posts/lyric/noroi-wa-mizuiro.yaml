lines:
  - text: あとすこし そばにいて
    pr: 아토스코시 소바니이테
    tl: 조금만 더 곁에 있어 줘
    time: [11.563, 16.309]
  - text: 読みたい漫画がみつかるまで
    pr: 요미타이만가가미츠카루마데
    tl: 읽고 싶은 만화를 찾을 때까지
    time: [16.319, 22.889]
  - text: 片足の折れたテーブルと
    pr: 카타아시노오레타테부루토
    tl: 다리 하나 부러진 테이블과
    time: [22.999, 27.805]
  - text: 水滴の音をどうにかするまで
    pr: 스이테키노오토오도니카스루마데
    tl: 물방울 소리를 어떻게든 할 때까지
    time: [27.815, 33.866]
  - text: 秘密の公園 同じ約束を
    pr: 히미츠노코엔 오나지야쿠소쿠오
    tl: 비밀의 공원에서 같은 약속을
    time: [34.057, 39.847]
  - text: あの人ともしたのね
    pr: 아노히토토모시타노네
    tl: 그 사람과도 했구나
    time: [40.086, 43.986]
  - text: 最後の手紙は赤く染めるわ
    pr: 사이고노테가미와아카쿠소메루와
    tl: 마지막 편지는 붉게 물들일게
    time: [45.468, 50.865]
  - text: 全部台無しにさせてよ
    pr: 젠부다이나시니사세테요
    tl: 전부 망치게 해 줘
    time: [50.975, 56.268]
  - text: 生きている 生きてゆく
    pr: 이키테이루 이키테유쿠
    tl: 살아 있어, 살아갈 거야
    time: [56.278, 61.946]
  - text: 生きてきた 愛の隣で
    pr: 이키테키타 아이노토나리데
    tl: 살아왔어, 사랑의 곁에서
    time: [61.956, 68.118]
  - text: 私達はいつか死ぬのよ
    pr: 와타시타치와이츠카시누노요
    tl: 우리는 언젠가 죽는 거야
    time: [68.128, 74.456]
  - text: 夜を越えても
    pr: 요루오코에테모
    tl: 밤을 넘어서도
    time: [75.826, 80.227]
  - text: 追いかけて バカみたい
    pr: 오이카케테 바카미타이
    tl: 쫓아가다니, 바보 같아
    time: [105.866, 110.649]
  - text: ベンチの二人がひらく青春
    pr: 벤치노후타리가히라쿠세이슌
    tl: 벤치에 앉은 두 사람이 펼치는 청춘
    time: [110.659, 117.246]
  - text: 私との夢の続きなら
    pr: 아타시토노유메노츠즈키나라
    tl: 나와 꾸던 꿈의 다음 이야기라면
    time: [117.357, 122.11]
  - text: 笑いに行くわよ はやくお逃げなさい
    pr: 와라이니이쿠와요 하야쿠오니게나사이
    tl: 비웃으러 갈게, 어서 도망가
    time: [122.12, 128.009]
  - text: あなたは正しい それでもやっぱり
