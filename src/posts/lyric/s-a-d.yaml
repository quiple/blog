lines:
  - text: 私がおかしいのかな
    pr: 와타시가오카시노카나
    tl: 내가 이상한 걸까
  - text: 黒板の前に立つと
    pr: 코쿠반노마에니타츠토
    tl: 칠판 앞에 서면
  - text: 心がざわつくの
    pr: 코코로가자와츠쿠노
    tl: 마음이 술렁여
  - text: (ざわめくの)
    pr: (자와메쿠노)
    tl: (술렁여)
  - text: 私はみんなと同じように
    pr: 와타시와민나토오나지요니
    tl: 나는 모두와 똑같이
  - text: しっかり立ち振る舞えてるのかな
    pr: 싯카리타치후루마에테루노카나
    tl: 제대로 행동하고 있는 건지
  - text: 不安になる
    pr: 후안니나루
    tl: 불안해져
  - text: (不安になる)
    pr: (후안니나루)
    tl: (불안해져)
  - text: 一言一句 間違えることなく
    pr: 히토코토잇쿠 마치가에루코토나쿠
    tl: 한마디 한 글자도 틀리지 않고
  - text: 頭の中にある台本を読み上げられるだろうか
    pr: 아타마노나카니아루다이혼오요미아게라레루다로카
    tl: 머릿속의 대본을 읽어 낼 수 있을까
  - text: 震える声で から回る口で
    pr: 후루에루코에데 카라마와루쿠치데
    tl: 떨리는 목소리로, 헛도는 입으로
  - text: 表に発していくんだ
    pr: 오모테니핫시테이쿤다
    tl: 밖으로 내뱉는 거야
  - text: みんなの前で恥をかきたくない
    pr: 민나노마에데하지오카키타쿠나이
    tl: 모두 앞에서 창피를 당하고 싶지 않아
  - text: 出来ることならば
    pr: 데키루코토나라바
    tl: 그럴 수만 있다면
  - text: 人前になんか出たくない!
    pr: 히토마에니난카데타쿠나이!
    tl: 사람들 앞 따윈 나서고 싶지 않아!
  - text: ええ、出たくないね
    pr: 에, 데타쿠나이네
    tl: 그래, 나서고 싶지 않네
  - text: 上手くいかないもん
    pr: 우마쿠이카나이몬
    tl: 잘 안 되는걸
  - text: めちゃくちゃに
    pr: 메차쿠차니
    tl: 엉망진창으로
  - text: 心が乱れるの!
    pr: 코코로가미다레루노!
    tl: 마음이 흐트러져!
  - text: どれだけ挑んでも
    pr: 도레다케이돈데모
    tl: 아무리 도전해도
  - text: 慣れやしない
    pr: 나레야시나이
    tl: 익숙해지지 않아
  - text: だから だから
    pr: 다카라 다카라
    tl: 그래서, 그래서
  - text: 避けたくなっちゃうの
    pr: 사케타쿠낫차우노
    tl: 피하고 싶어지는 거야
  - text: この心に平穏を!
    pr: 코노코코로니헤이온오!
    tl: 이 마음에 평온을!
  - text: この心に安寧を!
    pr: 코노코코로니안네이오!
    tl: 이 마음에 안녕을!
  - text: この心に救済を!
    pr: 코노코코로니큐사이오!
    tl: 이 마음에 구원을!
  - text: 私がおかしいのかな
    pr: 와타시가오카시노카나
