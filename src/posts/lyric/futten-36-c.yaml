    tl: 끓는점은 빌딩의 그림자
    time: [103.62, 106.52]
  - text: 汗に塗れている
    pr: 아세니마미레테이루
    tl: 땀으로 뒤덮여 있어
    time: [106.52, 109.77]
  - text: 消えるから良いんだ
    pr: 키에루카라이인다
    tl: 사라지니까 좋은 거야
    time: [109.77, 113.62]
  - text: 口笛も、面影も
