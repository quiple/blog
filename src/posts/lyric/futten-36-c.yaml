lines:
  - text: 後手にバタンとドアを閉めて
    pr: 우시로데니바탄토도아오시메테
    tl: 등 뒤로 쾅 하고 문을 닫고
    time: [30.01, 32.95]
  - text: もう後には退けないなんて
    pr: 모아토니와히케네난테
    tl: 이제 물러설 수 없다는 건
    time: [32.95, 35.5]
  - text: 分かり切った事さ
    pr: 와카리킷타코토사
    tl: 뻔히 알고 있는 일이야
    time: [35.5, 41.27]
  - text: 生まれたくて生まれたんじゃないと
    pr: 우마레타쿠테우마레탄자네토
    tl: 태어나고 싶어서 태어난 게 아니라며
    time: [41.27, 43.95]
  - text: 拗ねて世界に唾を吐いて
    pr: 스네테세카이니츠바오하이테
    tl: 토라져 세상에 침을 뱉고
    time: [43.95, 46.72]
  - text: 楽になったか?
    pr: 라쿠니낫타카?
    tl: 편해졌어?
    time: [46.72, 53.28]
  - text: 相変わらずさ
    pr: 아이카와라즈사
    tl: 여전해
    time: [53.28, 56.09]
  - text: 風が人々を
    pr: 카제가히토비토오
    tl: 바람이 사람들을
    time: [56.09, 59.2]
  - text: 連れ去るのを見てる
    pr: 츠레사루노오미테루
    tl: 데려가는 걸 보고 있어
    time: [59.2, 64.45]
  - text: 気付かないふりで
    pr: 키즈카나이후리데
    tl: 모르는 척하며
    time: [64.45, 67.5]
  - text: 長く変わらない信号を待っている
    pr: 나가쿠카와라나이신고오맛테이루
    tl: 오랫동안 바뀌지 않는 신호를 기다려
    time: [67.5, 75.74]
  - text: トンネルを抜け切ったと
    pr: 톤네루오누케킷타토
    tl: 터널을 다 빠져나왔다고
    time: [75.74, 77.71]
  - text: 思ったらそこは真夜中だった
    pr: 오못타라소코와마요나카닷타
    tl: 생각했더니 거긴 한밤중이었지
    time: [77.71, 80.61]
  - text: 一切合切、終わりか?
    pr: 잇사이갓사이, 오와리카?
    tl: 하나부터 열까지, 끝인가?
    time: [80.61, 83.15]
  - text: 終わりでも何でも構わない
    pr: 오와리데모난데모카마와나이
    tl: 끝이든 뭐든 상관없어
    time: [83.15, 86.86]
  - text: 沸点は掌に
    pr: 훗텐와테노히라니
    tl: 끓는점은 손바닥에
    time: [86.86, 89.62]
  - text: 沸点は首筋に
    pr: 훗텐와쿠비스지니
    tl: 끓는점은 목덜미에
    time: [89.62, 92.31]
  - text: 沸点は足の裏
    pr: 훗텐와아시노우라
    tl: 끓는점은 발바닥에
    time: [92.31, 95.68]
  - text: それだけがある
    pr: 소레다케가아루
    tl: 그것만이 있어
    time: [95.68, 97.99]
  - text: 沸点は青い空
    pr: 훗텐와아오이소라
    tl: 끓는점은 푸른 하늘
    time: [97.99, 100.82]
  - text: 沸点は白い雲
    pr: 훗텐와시로이쿠모
    tl: 끓는점은 하얀 구름
    time: [100.82, 103.62]
  - text: 沸点はビルの影
