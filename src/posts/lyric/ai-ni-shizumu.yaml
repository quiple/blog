lines:
  - text: あぁ手足が冷たくなっていく
    time: [0.761, 6.828]
  - text: 止めた呼吸吐き出した憂いを
    time: [7.302, 12.815]
  - text: 浮かんで弾ける水泡が見てる
    time: [13.779, 19.868]
  - text: 深い青に落ちてく中で
    time: [20.874, 26.56]
  - text: 暑いな今日もニュースが謳っていた
    time: [45.106, 49.834]
  - text: ぼんやりした波のように聞いた
    time: [50.141, 54.633]
  - text: 今日もみんなとは違う方へ歩く
    time: [55.234, 60.198]
  - text: 広く青い海を見ながら
    time: [60.915, 65.046]
  - text: 別世界にさ来た気になってんだ
    time: [65.752, 70.584]
  - text: ゆったりした波を見てるから
    time: [71.013, 75.361]
  - text: 忙しなく動く世界から逸らす
    time: [75.968, 80.971]
  - text: 視線を関心を音すら全部
    time: [81.591, 86.089]
  - text: 日々は変わる中で
    time: [86.413, 88.269]
  - text: 止まるわたしを置いて行く
    time: [88.269, 90.747]
  - text: あぁもう動くなよ繰り返す日々には
    time: [90.945, 94.229]
  - text: 飽き飽きしていたの
    time: [94.229, 95.962]
  - text: ならあんな時間があったのに
    time: [96.965, 100.556]
  - text: こんなに日々が過ぎたのに
    time: [100.789, 103.163]
  - text: 何一つこれ一つ
    time: [103.454, 105.257]
  - text: やってこなかった私は
    time: [105.257, 108.229]
  - text: 何にもできずに時間を無駄にして
    time: [108.646, 112.787]
  - text: 無意味な日々を繰り返して
    time: [112.98, 116.826]
  - text: もういいか全部疲れてしまったんだ
    time: [134.538, 139.387]
  - text: 荒くなった波を見てるから
    time: [139.744, 144.157]
  - text: 野蛮で単純な答えが過る
    time: [144.69, 149.742]
  - text: そうだな、
    time: [150.378, 151.45]
  - text: もういっそ終わりにしようか
    time: [151.677, 154.98]
  - text: もしも逃げ続けなければ
    time: [180.996, 183.657]
  - text: 別の日々を歩めたかな
    time: [184.114, 186.92]
  - text: 平凡でありふれた日々を
    time: [187.418, 190.636]
  - text: 送れてたかな
    time: [190.642, 193.45]
  - text: なんて思い悩んだって
    time: [193.884, 197]
  - text: 変わりはしない
    time: [197.047, 199.093]
  - text: 遅すぎた思いを払って
    time: [199.723, 204.245]
  - text: 迷いと後悔を脱ぎ捨てて
    time: [209.707, 212.061]
  - text: きっと元には戻れない
    time: [212.264, 214.6]
  - text: もう一回?
    time: [214.94, 215.744]
  - text: 何回やったって同じだったよな
    time: [215.744, 219.708]
  - text: さようなら終わりを願った世界に
    time: [219.843, 224.201]
  - text: 未練はないから
    time: [224.586, 226.28]
  - text: ほら藍に沈んで
