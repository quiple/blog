lines:
  - text: あ, 日焼け止め 塗らないままでいたな
    pr: 아, 히야케토메 누라나이마마데이타나
    tl: 아, 선크림을 바르지 않은 채였네
    time: [20.981, 28.92]
  - text: あんなにも大きな声が肌すれすれに来ることも,
    pr: 안나니모오키나코에가하다스레스레니쿠루코토모,
    tl: 그렇게 큰 목소리가 피부에 스칠 듯 다가오는 것도
    time: [29.209, 39.675]
  - text: 光は指輪みたいになること, も
    pr: 히카리와유비와미타이니나루코토, 모
    tl: 빛이 반지처럼 되는 것도
    time: [39.675, 47.718]
  - text: いずれ全部 明るい道の秘密のように思い出す
    pr: 이즈레젠부 아카루이미치노히미츠노요니오모이다스
    tl: 언젠가 전부 밝은 길의 비밀처럼 떠올리겠지
    time: [47.936, 59.165]
  - text: 僕たちは (いつ出会うだろう?)
    pr: 보쿠타치와 (이츠데아우다로?)
    tl: 우리는 (언제 만날까?)
    time: [61.693, 68.41]
  - text: 出会うときは
    pr: 데아우토키와
    tl: 만날 때는
    time: [68.737, 70.972]
  - text: 僕にとって正しい人の
    pr: 보쿠니톳테타다시히토노
    tl: 내게 맞는 사람의
    time: [71.355, 75.846]
  - text: 僕にとって正しい声でいる
    pr: 보쿠니톳테타다시코에데이루
    tl: 내게 맞는 목소리로 있어
    time: [76.04, 81.349]
  - text: 游ぶ指先や睫毛や
    pr: 아소부유비사키야마츠게야
    tl: 노니는 손끝과 속눈썹과
    time: [100.613, 106.293]
  - text: 髪留めがあなたたちの姿を覚えている
    pr: 카미도메가아나타타치노스가타오오보에테이루
    tl: 머리핀이 너희 모습을 기억하고 있어
    time: [106.453, 118.194]
  - text: 煌きと暗やみの層に躍り入る僕のことを誰かが見てる
    pr: 키라메키토쿠라야미노소니오도리하이루보쿠노코토오다레카가미테루
    tl: 반짝임과 어둠의 층으로 뛰어드는 나를 누군가 보고 있어
    time: [118.415, 132.532]
  - text: 安心して, 僕は帰らない, ほらね
    pr: 안신시테, 보쿠와카에라나이, 호라네
    tl: 안심해, 난 돌아가지 않아, 거봐
    time: [133.107, 138.163]
  - text: どこでも ああ, 何度でも目を瞑るほど日が差す方で
    pr: 도코데모 아, 난도데모메오츠무루호도히가사스호데
    tl: 어디든, 아아, 몇 번이고 눈을 감을 만큼 햇살이 드는 쪽에서
    time: [155.372, 169.383]
  - text: 僕は言う
    pr: 보쿠와유
    tl: 나는 말해
    time: [169.683, 171.883]
  - text: 僕は禁じる
    pr: 보쿠와킨지루
    tl: 나는 금해
    time: [172.047, 174.202]
  - text: 僕は覚える
    pr: 보쿠와오보에루
    tl: 나는 기억해
    time: [174.378, 176.535]
  - text: 僕は慄く
    pr: 보쿠와오노노쿠
    tl: 나는 전율해
    time: [176.718, 178.859]
  - text: 僕は踊る
    pr: 보쿠와오도루
    tl: 나는 춤춰
    time: [179.055, 181.138]
  - text: 僕は生れる
    pr: 보쿠와우마레루
    tl: 나는 태어나
    time: [181.394, 183.487]
  - text: 僕は褪せる
    pr: 보쿠와아세루
    tl: 나는 빛바래
    time: [183.749, 185.752]
  - text: 僕は判断する
    pr: 보쿠와한단스루
    tl: 나는 판단해
    time: [186.076, 189.278]
